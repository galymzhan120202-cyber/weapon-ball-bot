name: Weapon Ball Auto Upload

on:
  schedule:
    - cron: '15 4 * * *'    # 09:15 KZ
    - cron: '15 10 * * *'   # 15:15 KZ
    - cron: '15 16 * * *'   # 21:15 KZ
  workflow_dispatch:        # қолмен де іске қосуға болады

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Кодты алу
        uses: actions/checkout@v4

      - name: Python орнату
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: FFmpeg орнату
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Python кітапханаларын орнату
        run: pip install --quiet -r requirements.txt

      - name: YouTube деректерін қалпына келтіру
        env:
          WBALL_CLIENT_SECRETS_JSON: ${{ secrets.WBALL_CLIENT_SECRETS_JSON }}
          WBALL_YOUTUBE_TOKEN_JSON: ${{ secrets.WBALL_YOUTUBE_TOKEN_JSON }}
        run: |
          echo "$WBALL_CLIENT_SECRETS_JSON" > client_secrets.json
          echo "$WBALL_YOUTUBE_TOKEN_JSON" > youtube_token.json

      - name: .env файлын құру
        run: |
          cat > .env << 'EOF'
          TELEGRAM_NOTIFY_TOKEN=${{ secrets.WBALL_TELEGRAM_NOTIFY_TOKEN }}
          TELEGRAM_NOTIFY_CHAT_ID=${{ secrets.WBALL_TELEGRAM_NOTIFY_CHAT_ID }}
          BATTLE_MIN_SECONDS=13
          BATTLE_MAX_SECONDS=28
          MUSIC_VOLUME=0.15
          SFX_VOLUME=0.9
          YOUTUBE_CATEGORY_ID=20
          YOUTUBE_PRIVACY_STATUS=public
          YOUTUBE_MADE_FOR_KIDS=false
          VIDEO_CODEC=libx264
          AUDIO_CODEC=aac
          VIDEO_FPS=24
          VIDEO_PRESET=ultrafast
          VIDEO_WIDTH=1080
          VIDEO_HEIGHT=1920
          MAX_RETRIES=3
          RETRY_DELAY=2
          EOF

      - name: Видео құру және YouTube-ке жүктеу
        run: python -c "from video_gen import generate_video; generate_video()"
