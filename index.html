const cv = document.getElementById("c");
const ctx = cv.getContext("2d");

function fitCanvas() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = (W * s) + "px";
  cv.style.height = (H * s) + "px";
}
addEventListener("resize", fitCanvas); fitCanvas();

function drawTrail(f) {
  const r = f._baseR;
  for (let i = 0; i < f.trail.length; i++) {
    const p = f.trail[i], k = (i + 1) / f.trail.length;
    ctx.globalAlpha = k * 0.28;
    ctx.fillStyle = f.tint;
    ctx.beginPath(); ctx.arc(p.x, p.y, r * (0.35 + 0.5 * k), 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawWeaponBall(f, world) {
  const r = f._baseR * f.scale;
  ctx.save();
  ctx.translate(f.x, f.y);
  // body
  const g = ctx.createRadialGradient(-r * 0.3, -r * 0.3, r * 0.2, 0, 0, r);
  g.addColorStop(0, "#ffffff"); g.addColorStop(0.22, mixHex(f.tint, "#ffffff", 0.25)); g.addColorStop(1, shade(f.tint, -0.5));
  ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2);
  ctx.fillStyle = g; ctx.fill();
  if (f.hitFlash > 0) { ctx.fillStyle = `rgba(255,255,255,${f.hitFlash * 0.6})`; ctx.fill(); }
  ctx.lineWidth = 3; ctx.strokeStyle = f.hitFlash > 0 ? `rgba(255,255,255,${f.hitFlash})` : "rgba(0,0,0,.35)"; ctx.stroke();

  // weapon shape toward tip (local -y)
  ctx.rotate(f.angle);
  ctx.strokeStyle = shade(f.tint, 0.35); ctx.fillStyle = mixHex(f.tint, "#ffffff", 0.15); ctx.lineCap = "round";
  const reach = r * 1.15;
  drawBlade(f.kind, r, reach);
  ctx.restore();

  // active pickup buff — a coloured pulsing ring around the holder
  if (f.buff) {
    const T = PICKUP[f.buff.id];
    const pulse = 0.6 + 0.4 * Math.sin(world.t * 10);
    ctx.save();
    ctx.globalAlpha = pulse;
    ctx.strokeStyle = T.color; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(f.x, f.y, r + 12, 0, Math.PI * 2); ctx.stroke();
    if (f.buff.id === "shield" && f.shield > 0) {
      ctx.globalAlpha = 0.5; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(f.x, f.y, r + 20, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();
  }

  // player ring
  if (f.idx === world.playerIdx) {
    ctx.beginPath(); ctx.arc(f.x, f.y, r + 8, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(90,200,120,.9)"; ctx.lineWidth = 4; ctx.stroke();
  }
  // damage popup
  if (f.dmgPopT > 0 && f.eDmg > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, f.dmgPopT * 2);
    ctx.fillStyle = "#ff9f0a"; ctx.font = "600 40px " + UI_FONT;
    ctx.textAlign = "center";
    ctx.fillText("−" + f.eDmg, f.x, f.y - r - 18 - (0.7 - f.dmgPopT) * 60);
    ctx.restore();
  }
  if (f._tag && f._tag.t > 0) {
    ctx.save(); ctx.globalAlpha = Math.min(1, f._tag.t * 1.5);
    ctx.fillStyle = UI_WHITE; ctx.font = "600 34px " + UI_FONT; ctx.textAlign = "center";
    ctx.fillText(f._tag.txt, f.x, f.y - r - 60);
    ctx.restore();
    f._tag.t -= 1 / FPS;
  }
}

function drawBlade(kind, r, reach) {
  ctx.lineWidth = Math.max(6, r * 0.16);
  switch (kind) {
    case "spear": case "staff": case "trident": case "rapier": case "halberd":
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -reach * 1.35); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -reach * 1.35); ctx.lineTo(-r * 0.22, -reach * 1.05); ctx.lineTo(r * 0.22, -reach * 1.05); ctx.closePath(); ctx.fill();
      break;
    case "hammer": case "warhammer": case "mace":
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -reach); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -reach, r * 0.5, 0, Math.PI * 2); ctx.fill();
      break;
    case "axe": case "war_axe": case "tomahawk": case "cleaver": case "scythe":
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -reach); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, -reach); ctx.quadraticCurveTo(r * 0.9, -reach * 0.7, r * 0.5, -reach * 0.35);
      ctx.quadraticCurveTo(r * 0.2, -reach * 0.6, 0, -reach * 0.9); ctx.closePath(); ctx.fill();
      break;
    case "chainsaw":
      ctx.beginPath(); ctx.rect(-r * 0.28, -reach, r * 0.56, reach); ctx.fill();
      break;
    case "shuriken":
      ctx.beginPath();
      for (let i = 0; i < 4; i++) { const a = i * Math.PI / 2; ctx.moveTo(0, 0); ctx.lineTo(Math.cos(a) * reach, Math.sin(a) * reach); }
      ctx.lineWidth = r * 0.3; ctx.stroke();
      break;
    case "boomerang":
      ctx.beginPath(); ctx.moveTo(-reach * 0.7, 0); ctx.quadraticCurveTo(0, -reach * 0.8, reach * 0.7, 0);
      ctx.lineWidth = r * 0.28; ctx.stroke();
      break;
    case "whip": case "flail": case "nunchaku":
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.quadraticCurveTo(r * 0.5, -reach * 0.6, 0, -reach * 1.2); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, -reach * 1.2, r * 0.22, 0, Math.PI * 2); ctx.fill();
      break;
    case "claws":
      for (let i = -1; i <= 1; i++) {
        ctx.beginPath(); ctx.moveTo(i * r * 0.32, -r * 0.2);
        ctx.quadraticCurveTo(i * r * 0.5, -reach * 0.9, i * r * 0.2, -reach * 1.05); ctx.stroke();
      }
      break;
    case "pistol":
      ctx.beginPath(); ctx.rect(-r * 0.16, -reach * 0.95, r * 0.32, reach * 0.7); ctx.fill();
      ctx.beginPath(); ctx.rect(-r * 0.34, -reach * 0.28, r * 0.34, reach * 0.5); ctx.fill();
      break;
    case "dual_daggers":
      for (const s of [-1, 1]) {
        ctx.beginPath(); ctx.moveTo(s * r * 0.42, 0); ctx.lineTo(s * r * 0.42, -reach * 1.05); ctx.stroke();
      }
      break;
    default: // sword-like
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -reach * 1.25); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-r * 0.3, -r * 0.25); ctx.lineTo(r * 0.3, -r * 0.25); ctx.lineWidth = r * 0.14; ctx.stroke();
  }
}

function shade(hex, amt) {
  const c = hex.replace("#", "");
  let r = parseInt(c.substr(0, 2), 16), g = parseInt(c.substr(2, 2), 16), b = parseInt(c.substr(4, 2), 16);
  if (amt < 0) { r *= (1 + amt); g *= (1 + amt); b *= (1 + amt); }
  else { r += (255 - r) * amt; g += (255 - g) * amt; b += (255 - b) * amt; }
  return `rgb(${r | 0},${g | 0},${b | 0})`;
}

// set ctx.font to the largest "<weight> <px>px" that fits `text` in `maxW`
function fitFont(text, weight, px, maxW) {
  let size = px;
  do {
    ctx.font = weight + " " + size + "px " + UI_FONT;
    if (ctx.measureText(text).width <= maxW) break;
    size -= 4;
  } while (size > 16);
  return size;
}

function drawHazard(world) {
  const th = world.theme, H4 = world.haz;
  if (world.hazard === "pit") {
    const pr = H4.pitR * (1 + 0.03 * Math.sin(world.t * 4));
    const g = ctx.createRadialGradient(world.cx, world.cy, pr * 0.2, world.cx, world.cy, pr);
    g.addColorStop(0, "rgba(255,150,60,0.85)"); g.addColorStop(0.6, "rgba(200,40,20,0.6)"); g.addColorStop(1, "rgba(120,10,10,0.05)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(world.cx, world.cy, pr, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(255,120,40,0.7)"; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(world.cx, world.cy, pr, 0, Math.PI * 2); ctx.stroke();
  } else if (world.hazard === "pegs") {
    for (const p of H4.pegs) {
      const gg = ctx.createRadialGradient(p.x - 6, p.y - 6, 2, p.x, p.y, p.r);
      gg.addColorStop(0, "#ffffff"); gg.addColorStop(0.4, th.accent); gg.addColorStop(1, shade(th.accent, -0.5));
      ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 2; ctx.stroke();
    }
  } else if (world.hazard === "saw") {
    const s = H4.saw, sp = world._sawPos();
    ctx.save(); ctx.translate(sp.x, sp.y); ctx.rotate(s.rot);
    ctx.fillStyle = "#c9ccd4";
    for (let i = 0; i < 10; i++) {
      ctx.rotate(Math.PI / 5);
      ctx.beginPath(); ctx.moveTo(s.r - 4, -6); ctx.lineTo(s.r + 10, 0); ctx.lineTo(s.r - 4, 6); ctx.closePath(); ctx.fill();
    }
    ctx.beginPath(); ctx.arc(0, 0, s.r, 0, Math.PI * 2);
    ctx.fillStyle = "#8b9099"; ctx.fill();
    ctx.beginPath(); ctx.arc(0, 0, s.r * 0.35, 0, Math.PI * 2);
    ctx.fillStyle = "#3a3d44"; ctx.fill();
    ctx.restore();
    // track line
    ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(world.cx - Math.cos(s.a) * s.span, world.cy - Math.sin(s.a) * s.span);
    ctx.lineTo(world.cx + Math.cos(s.a) * s.span, world.cy + Math.sin(s.a) * s.span);
    ctx.stroke();
  } else if (world.hazard === "wind") {
    const w = H4.wind;
    ctx.strokeStyle = "rgba(200,222,255,.26)"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    for (const st of w.streaks) {
      ctx.beginPath(); ctx.moveTo(st.x, st.y);
      ctx.lineTo(st.x - Math.cos(w.a) * st.len * 1.6, st.y - Math.sin(w.a) * st.len * 1.6); ctx.stroke();
    }
  } else if (world.hazard === "ice") {
    ctx.fillStyle = "rgba(150,220,255,0.05)";
    ctx.beginPath(); ctx.arc(world.cx, world.cy, world.arenaR, 0, Math.PI * 2); ctx.fill();
  }
}

/* =====================================================================
   Playable-mode menu — Apple-flavoured: near-black stage, one accent,
   tight-tracked wordmark, rounded pills, generous air. Canvas-drawn +
   pointer hit-tested (works on touch). MENU.buttons is rebuilt here
   every frame; menuHit(x,y) consumes it.
   ===================================================================== */
const MENU_ACCENT = "#0a84ff";
// One shared type + colour system for every on-canvas surface (HUD, countdown,
// winner card, callouts) so the whole game reads as one Apple-flavoured screen.
const UI_FONT   = '"SF Pro Display", -apple-system, "Segoe UI", system-ui, sans-serif';
const UI_ACCENT = "#0a84ff";
const UI_WHITE  = "#f5f5f7";
const UI_GRAY   = "#8e8e93";   // captions / secondary
const UI_DIM    = "#6e6e73";   // tertiary hints
// rounded-rect helper reused outside the menu (falls back if roundRect missing)
function uiRoundRect(x, y, w, h, r) {
  if (ctx.roundRect) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); return; }
  mRound(x, y, w, h, r);
}
function mRound(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function mPill(id, x, y, w, h, label, on, opts) {
  opts = opts || {};
  MENU.buttons.push({ id, x, y, w, h });
  const rad = opts.rad != null ? opts.rad : h / 2;
  ctx.save();
  if (on) {
    ctx.fillStyle = opts.solid || MENU_ACCENT;
    mRound(x, y, w, h, rad); ctx.fill();
    ctx.fillStyle = "#fff";
  } else {
    ctx.fillStyle = "rgba(255,255,255,.05)";
    mRound(x, y, w, h, rad); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.14)"; ctx.lineWidth = 1.5;
    mRound(x + 0.75, y + 0.75, w - 1.5, h - 1.5, rad); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,.82)";
  }
  ctx.font = (opts.font || "600 " + Math.round(h * 0.42) + "px") + ' "SF Pro Display", -apple-system, "Segoe UI", sans-serif';
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.fillText(label, x + w / 2, y + h / 2 + 1);
  ctx.restore();
  ctx.textBaseline = "alphabetic";
}
function drawMenu() {
  MENU.buttons.length = 0;
  const F = '"SF Pro Display", -apple-system, "Segoe UI", system-ui, sans-serif';

  // stage
  const bg = ctx.createRadialGradient(W / 2, H * 0.32, 0, W / 2, H * 0.42, Math.max(W, H) * 0.75);
  bg.addColorStop(0, "#17181d"); bg.addColorStop(0.55, "#101014"); bg.addColorStop(1, "#08080a");
  ctx.fillStyle = "#08080a"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
  const gl = ctx.createRadialGradient(W / 2, -H * 0.12, 0, W / 2, -H * 0.12, W * 0.6);
  gl.addColorStop(0, "rgba(10,132,255,0.14)"); gl.addColorStop(1, "rgba(10,132,255,0)");
  ctx.fillStyle = gl; ctx.fillRect(0, 0, W, H);

  if (MENU.screen === "weapons") return drawWeaponPicker(F);

  // ---- wordmark ----
  ctx.textAlign = "center"; ctx.fillStyle = "#f5f5f7";
  ctx.font = `600 96px ${F}`;
  ctx.save(); ctx.translate(0, 0);
  // tight tracking
  const word = "Weapon Ball Arena";
  let tw = 0; for (const ch of word) tw += ctx.measureText(ch).width - 2;
  let cur = W / 2 - tw / 2;
  for (const ch of word) { ctx.textAlign = "left"; ctx.fillText(ch, cur, 300); cur += ctx.measureText(ch).width - 2; }
  ctx.restore();
  ctx.textAlign = "center"; ctx.fillStyle = "#86868b"; ctx.font = `400 30px ${F}`;
  ctx.fillText("Physics duels. A new fight every day.", W / 2, 352);

  const L = 200;                                    // left rail x

  // ---- MODE ----
  ctx.fillStyle = "#86868b"; ctx.font = `600 24px ${F}`; ctx.textAlign = "left";
  ctx.fillText("MODE", L, 520);
  mPill("mode_play",  L,       540, 330, 100, "Play",  MENU.mode === "play");
  mPill("mode_watch", L + 350, 540, 330, 100, "Watch", MENU.mode === "watch");
  ctx.fillStyle = "#6e6e73"; ctx.font = `400 24px ${F}`; ctx.textAlign = "left";
  ctx.fillText(MENU.mode === "play" ? "You steer one ball — pointer aims, hold to thrust."
                                    : "Sit back and watch the AI fight it out.", L, 690);

  // ---- FIGHTERS ----
  ctx.fillStyle = "#86868b"; ctx.font = `600 24px ${F}`;
  ctx.fillText("FIGHTERS", L, 770);
  [2, 3, 4].forEach((k, i) => mPill("n_" + k, L + i * 150, 790, 130, 92, "" + k, MENU.n === k));

  // ---- WEAPONS (play mode) ----
  if (MENU.mode === "play") {
    ctx.fillStyle = "#86868b"; ctx.font = `600 24px ${F}`;
    ctx.fillText("YOUR WEAPON", L, 950);
    mPill("pick_a", L, 970, 400, 96, MENU.pickA ? prettyKind(MENU.pickA) : "Random", !!MENU.pickA, { rad: 20, font: "600 34px" });
    ctx.fillStyle = "#86868b"; ctx.font = `600 24px ${F}`;
    ctx.fillText("OPPONENT", L + 440, 950);
    mPill("pick_b", L + 440, 970, 400, 96, MENU.pickB ? prettyKind(MENU.pickB) : "Random", !!MENU.pickB, { rad: 20, font: "600 34px" });
  }

  // ---- START ----
  mPill("start", W / 2 - 320, 1240, 640, 140, MENU.mode === "play" ? "Fight" : "Watch fight", true,
        { rad: 44, solid: MENU_ACCENT, font: "700 54px" });

  ctx.fillStyle = "#6e6e73"; ctx.font = `400 24px ${F}`; ctx.textAlign = "center";
  ctx.fillText("Space or tap the button to start  ·  R restart  ·  M mute", W / 2, 1470);
}
function drawWeaponPicker(F) {
  ctx.textAlign = "center"; ctx.fillStyle = "#f5f5f7"; ctx.font = `600 56px ${F}`;
  ctx.fillText(MENU.pickFor === "a" ? "Your weapon" : "Opponent", W / 2, 170);

  const cols = 3, cw = 300, ch = 108, gapx = 24, gapy = 20;
  const gridW = cols * cw + (cols - 1) * gapx;
  const x0 = (W - gridW) / 2, y0 = 240;
  const cells = [{ kind: null, name: "Random" }].concat(ROSTER.map(w => ({ kind: w.kind, name: w.name, color: w.color })));
  const sel = MENU.pickFor === "a" ? MENU.pickA : MENU.pickB;
  cells.forEach((c, i) => {
    const cx = x0 + (i % cols) * (cw + gapx);
    const cy = y0 + Math.floor(i / cols) * (ch + gapy);
    const on = (c.kind || null) === (sel || null);
    MENU.buttons.push({ id: "w_" + (c.kind || "random"), x: cx, y: cy, w: cw, h: ch, kind: c.kind || null });
    ctx.save();
    ctx.fillStyle = on ? MENU_ACCENT : "rgba(255,255,255,.05)";
    mRound(cx, cy, cw, ch, 20); ctx.fill();
    if (!on) { ctx.strokeStyle = "rgba(255,255,255,.12)"; ctx.lineWidth = 1.5; mRound(cx + 1, cy + 1, cw - 2, ch - 2, 20); ctx.stroke(); }
    if (c.color) {
      ctx.fillStyle = c.color;
      ctx.beginPath(); ctx.arc(cx + 44, cy + ch / 2, 16, 0, Math.PI * 2); ctx.fill();
    }
    ctx.fillStyle = on ? "#fff" : "rgba(255,255,255,.85)";
    ctx.font = `600 30px ${F}`; ctx.textAlign = "left"; ctx.textBaseline = "middle";
    ctx.fillText(c.name, cx + (c.color ? 76 : 28), cy + ch / 2 + 1);
    ctx.restore();
    ctx.textBaseline = "alphabetic";
  });
  mPill("wp_back", W / 2 - 200, H - 200, 400, 96, "Done", true, { rad: 30, font: "700 40px" });
}
function prettyKind(k) {
  const w = ROSTER.find(x => x.kind === k);
  return w ? w.name : k;
}
function menuHit(x, y) {
  for (const b of MENU.buttons) {
    if (x < b.x || x > b.x + b.w || y < b.y || y > b.y + b.h) continue;
    const id = b.id;
    if (id === "mode_play") MENU.mode = "play";
    else if (id === "mode_watch") MENU.mode = "watch";
    else if (id.startsWith("n_")) MENU.n = parseInt(id.slice(2), 10);
    else if (id === "pick_a") { MENU.screen = "weapons"; MENU.pickFor = "a"; }
    else if (id === "pick_b") { MENU.screen = "weapons"; MENU.pickFor = "b"; }
    else if (id === "wp_back") MENU.screen = "home";
    else if (id.startsWith("w_")) {
      if (MENU.pickFor === "a") MENU.pickA = b.kind; else MENU.pickB = b.kind;
      MENU.screen = "home";
    } else if (id === "start") startFromMenu();
    return true;
  }
  return false;
}
function startFromMenu() {
  world = new World();
  world.state = "intro"; world.t = 0; prevState = "intro";
}

function render(world) {
  const th = world.theme;

  // background (fills the whole frame, drawn before any camera transform)
  const bg = ctx.createRadialGradient(world.cx, world.cy, 60, world.cx, world.cy, Math.max(W, H) * 0.85);
  bg.addColorStop(0, shade(th.bg, 0.14)); bg.addColorStop(1, th.bg);
  ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);

  ctx.save();
  // camera: winner punch-in on the finish, plus impact shake
  if (world.zoom > 1.001 && world.winner) {
    const wx = world.winner.x, wy = world.winner.y;
    ctx.translate(wx, wy); ctx.scale(world.zoom, world.zoom); ctx.translate(-wx, -wy);
  } else if (world.slowmo > 0 && world._slowFocus) {
    // gentle push-in on the killing blow during the slow-mo beat
    const k = 1 + 0.16 * Math.min(1, (0.85 - world.slowmo) * 3);
    const fx = world._slowFocus.x, fy = world._slowFocus.y;
    ctx.translate(fx, fy); ctx.scale(k, k); ctx.translate(-fx, -fy);
  }
  if (world.shakes > 0.4) ctx.translate(rnd(-1, 1) * world.shakes, rnd(-1, 1) * world.shakes);

  // ambient drifting particles
  for (const p of world.ambient) {
    ctx.globalAlpha = p.a; ctx.fillStyle = th.particle;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // grid
  ctx.strokeStyle = th.grid; ctx.lineWidth = 2; ctx.globalAlpha = 0.5;
  for (let x = 0; x <= W; x += 90) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y <= H; y += 90) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  ctx.globalAlpha = 1;

  // storm band (outside the closing arena) + arena ring
  ctx.save();
  ctx.beginPath();
  ctx.arc(world.cx, world.cy, world.arenaR0 + 400, 0, Math.PI * 2);
  ctx.arc(world.cx, world.cy, world.arenaR, 0, Math.PI * 2, true);
  const closing = 1 - (world.arenaR - world.arenaRmin) / (world.arenaR0 - world.arenaRmin);
  ctx.fillStyle = `rgba(190,30,55,${0.10 + 0.14 * closing})`; ctx.fill("evenodd");
  ctx.restore();
  ctx.beginPath(); ctx.arc(world.cx, world.cy, world.arenaR, 0, Math.PI * 2);
  ctx.strokeStyle = th.accent; ctx.lineWidth = 5; ctx.globalAlpha = 0.9; ctx.stroke();
  ctx.lineWidth = 14; ctx.globalAlpha = 0.12; ctx.stroke();
  ctx.globalAlpha = 1;

  // arena hazard
  if (world.hazard) drawHazard(world);

  // pickup orbs
  for (const p of world.pickups) {
    const T = PICKUP[p.id];
    const grow = Math.min(1, p.born * 4);
    const pr = Math.max(2, p.r * grow), pulse = 0.5 + 0.5 * Math.sin(p.born * 6 + p.bob);
    const arming = p.armT > 0;
    ctx.save();
    ctx.translate(p.x, p.y + Math.sin(p.born * 3 + p.bob) * 6);
    // glow
    const gg = ctx.createRadialGradient(0, 0, 0, 0, 0, pr * 2.4);
    gg.addColorStop(0, T.color + (arming ? "66" : "aa")); gg.addColorStop(1, T.color + "00");
    ctx.fillStyle = gg; ctx.beginPath(); ctx.arc(0, 0, pr * 2.4, 0, Math.PI * 2); ctx.fill();
    // arming telegraph — a shrinking countdown ring
    if (arming) {
      const k = p.armT / 1.2;
      ctx.strokeStyle = T.color; ctx.globalAlpha = 0.9; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(0, 0, pr + 6 + k * 40, -Math.PI / 2, -Math.PI / 2 + (1 - k) * Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }
    // ring
    ctx.strokeStyle = T.color; ctx.lineWidth = 4 + pulse * 3;
    ctx.beginPath(); ctx.arc(0, 0, pr, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "rgba(10,12,20,.72)"; ctx.beginPath(); ctx.arc(0, 0, Math.max(1, pr - 3), 0, Math.PI * 2); ctx.fill();
    // glyph
    ctx.fillStyle = "#fff"; ctx.font = "700 30px " + UI_FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(T.glyph, 0, 1);
    ctx.textBaseline = "alphabetic";
    ctx.restore();
  }

  // motion trails (under the balls)
  for (const f of world.fighters) if (f.alive) drawTrail(f);

  // impact rings
  for (const r of world.rings) {
    ctx.globalAlpha = Math.max(0, r.life * 2.6);
    ctx.strokeStyle = r.c; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.rr, 0, Math.PI * 2); ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // sparks
  for (const p of world.sparks) {
    ctx.globalAlpha = Math.max(0, Math.min(1, p.life * 2.4));
    ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  // thrown weapons
  for (const p of world.projectiles) {
    ctx.save();
    ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.fillStyle = p.col; ctx.strokeStyle = "rgba(255,255,255,.6)"; ctx.lineWidth = 2;
    if (p.kind === "pistol") {
      ctx.beginPath(); ctx.ellipse(0, 0, 11, 5, 0, 0, Math.PI * 2); ctx.fill();
    } else if (p.kind === "boomerang") {
      ctx.beginPath(); ctx.moveTo(-12, 6); ctx.lineTo(2, -12); ctx.lineTo(12, 6); ctx.lineTo(2, 0); ctx.closePath(); ctx.fill(); ctx.stroke();
    } else { // shuriken
      ctx.beginPath();
      for (let i = 0; i < 4; i++) { ctx.rotate(Math.PI / 2); ctx.moveTo(0, 0); ctx.lineTo(3, -14); ctx.lineTo(-3, -14); }
      ctx.closePath(); ctx.fill();
    }
    ctx.restore();
    ctx.globalAlpha = 0.5; ctx.strokeStyle = p.col; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 0.02, p.y - p.vy * 0.02); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // KO shards (weapon debris)
  for (const s of world.shards) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, s.life * 1.6));
    ctx.translate(s.x, s.y); ctx.rotate(s.rot);
    ctx.strokeStyle = s.c; ctx.lineWidth = 4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(-s.len / 2, 0); ctx.lineTo(s.len / 2, 0); ctx.stroke();
    ctx.restore();
  }
  ctx.globalAlpha = 1;

  // fighters
  for (const f of world.fighters) if (f.alive) drawWeaponBall(f, world);

  // flash
  if (world.flash > 0.02) { ctx.fillStyle = `rgba(255,255,255,${Math.min(0.6, world.flash * 0.5)})`; ctx.fillRect(-W, -H, W * 3, H * 3); }

  ctx.restore();

  // confetti (winner card) — above the camera transform so it fills the frame
  for (const c of world.confetti) {
    ctx.save();
    ctx.translate(c.x, c.y); ctx.rotate(c.rot);
    ctx.fillStyle = c.c; ctx.fillRect(-c.w / 2, -c.h / 2, c.w, c.h);
    ctx.restore();
  }

  // vignette (cinematic edge darkening, above the camera transform)
  const vg = ctx.createRadialGradient(W / 2, world.cy, H * 0.30, W / 2, world.cy, H * 0.74);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.34)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  // ---------- HUD ----------
  drawHud(world);
}

function countdownLabel(t) {
  return t < 0.75 ? "3" : t < 1.5 ? "2" : t < 2.25 ? "1" : "FIGHT!";
}

function drawHud(world) {
  const th = world.theme;

  // title (the menu screen draws its own hero title, so skip it there)
  if (world.state !== "menu") {
    ctx.textAlign = "center";
    ctx.fillStyle = "rgba(245,245,247,.9)"; ctx.font = "600 40px " + UI_FONT;
    if ("letterSpacing" in ctx) ctx.letterSpacing = "1px";
    ctx.fillText("Weapon Ball Arena", W / 2, 72);
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
    ctx.font = "400 22px " + UI_FONT; ctx.fillStyle = UI_GRAY;
    // seed is a dev detail — keep it off the recorded frames unless ?debug=1
    ctx.fillText((AUTO && !DEBUG) ? th.name : th.name + "   ·   seed " + SEED, W / 2, 106);
  }

  // rule chips — mutator and/or hazard, under the theme name
  if (world.state !== "menu" && (world.mutator || world.hazard)) {
    ctx.textAlign = "center";
    const chip = (label, tint, cy) => {
      ctx.font = "600 25px " + UI_FONT;
      const w = ctx.measureText(label).width + 54;
      ctx.fillStyle = tint; ctx.globalAlpha = 0.14;
      uiRoundRect(W / 2 - w / 2, cy - 27, w, 42, 21); ctx.fill();
      ctx.globalAlpha = 0.4; ctx.strokeStyle = tint; ctx.lineWidth = 1;
      uiRoundRect(W / 2 - w / 2, cy - 27, w, 42, 21); ctx.stroke();
      ctx.globalAlpha = 1; ctx.fillStyle = tint;
      ctx.fillText(label, W / 2, cy);
    };
    let cy = 146;
    if (world.mutator) { chip("⚡ " + world.mutator.name, world.mutator.tint, cy); cy += 46; }
    if (world.hazard)  { chip("⚠ " + HAZARD_NAME[world.hazard], world.theme.accent, cy); cy += 46; }
    if (world.mutator && world.state === "intro" && world.t < 2.4) {
      ctx.globalAlpha = Math.min(1, (2.4 - world.t) * 1.5);
      ctx.font = "400 28px " + UI_FONT; ctx.fillStyle = "rgba(245,245,247,.92)";
      ctx.fillText(world.mutator.blurb, W / 2, cy + 6);
      ctx.globalAlpha = 1;
    }
  }

  // ---------- menu ----------
  if (world.state === "menu") { drawMenu(); return; }

  // HP bars (pushed down for each rule chip shown above them)
  const bw = W - 160, x0 = 80;
  let y = 148 + (world.mutator ? 66 : 0) + (world.hazard ? 46 : 0);
  for (const f of world.fighters) {
    const frac = Math.max(0, Math.min(1, f.hp / f.maxHp));
    const chip = Math.max(0, Math.min(1, f.chipHp / f.maxHp));
    const low = f.alive && frac > 0 && frac < 0.25;
    const pulse = low ? 0.55 + 0.45 * Math.sin(world.t * 12) : 1;

    ctx.textAlign = "left"; ctx.font = "600 25px " + UI_FONT;
    ctx.fillStyle = f.alive ? UI_WHITE : "rgba(245,245,247,.32)";
    const roleTag = f._role ? "  — " + f._role : "";
    ctx.fillText(f.name + (f.idx === world.playerIdx ? "  (YOU)" : "") + roleTag, x0, y - 10);
    // active buff chip
    if (f.buff && f.alive) {
      const T = PICKUP[f.buff.id];
      const nameW = ctx.measureText(f.name + roleTag).width;
      const bt = " " + T.name + (f.buff.id === "shield" ? " ×" + f.shield : "") + " ";
      ctx.font = "600 17px " + UI_FONT;
      const cw = ctx.measureText(bt).width + 8;
      ctx.fillStyle = T.color;
      uiRoundRect(x0 + nameW + 20, y - 28, cw, 24, 12); ctx.fill();
      ctx.fillStyle = "#08080a"; ctx.fillText(bt, x0 + nameW + 24, y - 11);
    }
    ctx.textAlign = "right"; ctx.font = "600 22px " + UI_FONT;
    ctx.fillStyle = f.alive ? "rgba(245,245,247,.7)" : "#ff453a";
    ctx.fillText(f.alive ? Math.ceil(f.hp) + "" : "OUT", x0 + bw, y - 10);

    const barH = 14, barR = 7;
    ctx.fillStyle = "rgba(255,255,255,.08)"; uiRoundRect(x0, y, bw, barH, barR); ctx.fill();
    if (chip > 0.001) { ctx.fillStyle = "rgba(255,120,120,.4)"; uiRoundRect(x0, y, bw * chip, barH, barR); ctx.fill(); }
    ctx.globalAlpha = pulse;
    ctx.fillStyle = f.alive ? mixHex(f.tint, "#ffffff", 0.3) : "#4a4a4a";
    if (frac > 0.001) { uiRoundRect(x0, y, bw * frac, barH, barR); ctx.fill(); }
    ctx.globalAlpha = 1;
    if (low) { ctx.strokeStyle = "#ff453a"; ctx.lineWidth = 2; uiRoundRect(x0 - 1, y - 1, bw + 2, barH + 2, barR + 1); ctx.stroke(); }
    y += 44;
  }

  // countdown
  if (world.state === "intro") {
    const lbl = countdownLabel(world.t);
    const seg = world.t < 0.75 ? world.t : world.t < 1.5 ? world.t - 0.75 : world.t < 2.25 ? world.t - 1.5 : world.t - 2.25;
    const pop = 1 + Math.max(0, 0.25 - seg) * 3;                 // little scale-in each beat
    ctx.save();
    ctx.translate(W / 2, world.cy - 250); ctx.scale(pop, pop);
    ctx.textAlign = "center";
    ctx.font = (lbl === "FIGHT!" ? "300 128px " : "200 190px ") + UI_FONT;
    ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 32; ctx.shadowOffsetY = 4;
    ctx.fillStyle = lbl === "FIGHT!" ? UI_ACCENT : UI_WHITE; ctx.fillText(lbl, 0, 0);
    ctx.restore();

    // weapon name tags early in the countdown so viewers learn who's who
    if (world.t < 1.9) {
      ctx.globalAlpha = Math.min(1, (1.9 - world.t) * 2);
      for (const f of world.fighters) {
        ctx.textAlign = "center"; ctx.font = "600 24px " + UI_FONT;
        const tw = ctx.measureText(f.name).width + 32;
        ctx.fillStyle = "rgba(8,8,10,.6)";
        uiRoundRect(f.x - tw / 2, f.y + f._baseR + 8, tw, 34, 17); ctx.fill();
        ctx.fillStyle = mixHex(f.tint, "#ffffff", 0.4);
        ctx.fillText(f.name, f.x, f.y + f._baseR + 30);
      }
      ctx.globalAlpha = 1;
    }

    // "WHO WINS? — comment your pick" engagement beat (recorded runs only)
    if (AUTO && world.t > 0.5 && world.t < INTRO_SECONDS) {
      const a = Math.min(1, (world.t - 0.5) * 3) * Math.min(1, (INTRO_SECONDS - world.t) * 4);
      ctx.save(); ctx.globalAlpha = a; ctx.textAlign = "center";
      ctx.font = "700 56px " + UI_FONT; ctx.fillStyle = UI_ACCENT;
      ctx.fillText("WHO WINS?", W / 2, world.cy + 300);
      ctx.font = "500 34px " + UI_FONT; ctx.fillStyle = "rgba(245,245,247,.92)";
      ctx.fillText(world.fighters.map(f => f.name).join("  vs  "), W / 2, world.cy + 350);
      ctx.font = "600 30px " + UI_FONT; ctx.fillStyle = "#ff9f0a";
      ctx.fillText("comment your pick ▼", W / 2, world.cy + 398);
      ctx.restore();
    }
  }

  // big screen callout (FIRST BLOOD etc.)
  if (world.callout) {
    const a = Math.min(1, world.callout.t * 2);
    ctx.save(); ctx.globalAlpha = a; ctx.textAlign = "center";
    ctx.font = "700 74px " + UI_FONT;
    ctx.shadowColor = "rgba(0,0,0,.45)"; ctx.shadowBlur = 24; ctx.shadowOffsetY = 3;
    ctx.fillStyle = "#ff9f0a"; ctx.fillText(world.callout.txt, W / 2, world.cy - 320);
    ctx.restore();
  }

  // clock
  if (world.state === "fight") {
    const left = Math.max(0, BATTLE_MAX_SECONDS - world.t);
    ctx.textAlign = "center"; ctx.font = "600 32px " + UI_FONT;
    ctx.fillStyle = left < 6 ? "#ff453a" : "rgba(245,245,247,.7)";
    ctx.fillText(left.toFixed(1) + "s", W / 2, H - 64);
  }

  // winner card
  if (world.state === "over" && world.winner) {
    const wn = world.winner;
    const inT = Math.min(1, world.t * 2.2);
    ctx.save(); ctx.globalAlpha = inT;
    // centred frosted card rather than an edge-to-edge band
    const cardW = Math.min(W - 120, 900), cardX = (W - cardW) / 2, cardY = world.cy - 230;
    ctx.fillStyle = "rgba(18,18,20,.82)";
    uiRoundRect(cardX, cardY, cardW, 500, 40); ctx.fill();
    ctx.strokeStyle = "rgba(255,255,255,.1)"; ctx.lineWidth = 1;
    uiRoundRect(cardX, cardY, cardW, 500, 40); ctx.stroke();
    ctx.textAlign = "center";
    fitFont(world.finishText, "600", 54, cardW - 100); ctx.fillStyle = UI_ACCENT;
    ctx.fillText(world.finishText, W / 2, world.cy - 96);
    fitFont(wn.name.toUpperCase(), "700", 100, cardW - 90); ctx.fillStyle = UI_WHITE;
    ctx.fillText(wn.name.toUpperCase(), W / 2, world.cy + 14);
    ctx.font = "600 26px " + UI_FONT; ctx.fillStyle = UI_GRAY;
    if ("letterSpacing" in ctx) ctx.letterSpacing = "3px";
    ctx.fillText("WINNER", W / 2, world.cy + 74);
    if ("letterSpacing" in ctx) ctx.letterSpacing = "0px";
    // stat line — kills · HP left · (mutator)
    const bits = [];
    if (wn.kills > 0) bits.push(wn.kills + (wn.kills === 1 ? " KO" : " KOs"));
    bits.push(Math.max(0, Math.ceil(wn.hp)) + " / " + Math.round(wn.maxHp) + " HP");
    if (world.mutator) bits.push(world.mutator.name);
    ctx.font = "400 30px " + UI_FONT; ctx.fillStyle = "rgba(245,245,247,.8)";
    ctx.fillText(bits.join("   ·   "), W / 2, world.cy + 132);
    ctx.restore();
    if (AUTO) {
      ctx.globalAlpha = Math.max(0, Math.min(1, (world.t - 0.6) * 2));
      ctx.textAlign = "center"; ctx.font = "600 44px " + UI_FONT; ctx.fillStyle = UI_WHITE;
      ctx.fillText("▶ SUBSCRIBE — new fight every day", W / 2, world.cy + 216);
      ctx.globalAlpha = 1;
    } else {
      ctx.textAlign = "center"; ctx.font = "400 26px " + UI_FONT; ctx.fillStyle = UI_DIM;
      ctx.fillText("press R  ·  tap to fight again", W / 2, world.cy + 200);
    }
  }
}

// ---------------------------------------------------------------------
// Input
// ---------------------------------------------------------------------
const input = { aimX: null, aimY: null, thrust: false, keys: new Set() };
function pointerPos(e) {
  const r = cv.getBoundingClientRect();
  const px = (e.touches ? e.touches[0].clientX : e.clientX) - r.left;
  const py = (e.touches ? e.touches[0].clientY : e.clientY) - r.top;
  input.aimX = px / r.width * W;
  input.aimY = py / r.height * H;
}
cv.addEventListener("pointerdown", e => {
  pointerPos(e);
  if (typeof advanceFromUI === "function" && advanceFromUI()) return;
  input.thrust = true;
});
cv.addEventListener("pointermove", e => pointerPos(e));
addEventListener("pointerup", () => { input.thrust = false; });
addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  input.keys.add(k);
  if ((k === " " || k === "enter")) {
    if (world.state === "menu") {
      if (MENU.screen === "weapons") MENU.screen = "home"; else startFromMenu();
      return;
    }
    if (typeof advanceFromUI === "function" && advanceFromUI()) return;
  }
  if (k === " ") input.thrust = true;
  if (k === "r") restart();
  if (k === "m") location.href = toggleParam("mute");
});
addEventListener("keyup", e => { const k = e.key.toLowerCase(); input.keys.delete(k); if (k === " ") input.thrust = false; });
addEventListener("blur", () => { input.keys.clear(); input.thrust = false; });
function toggleParam(p) { const u = new URL(location.href); u.searchParams.set(p, u.searchParams.get(p) === "1" ? "0" : "1"); return u.toString(); }

// ---------------------------------------------------------------------
// Recording
//   ?record=1   -> in-browser MediaRecorder -> downloadable .webm
//                  (quick, works from a foreground tab, no Node needed)
//   ?encode=wc  -> in-page WebCodecs H.264 encoder; the Node recorder
//                  pulls the raw Annex-B stream and ffmpeg-wraps it to
//                  mp4. ~5-10x faster than screenshotting every frame.
// ---------------------------------------------------------------------
let recorder = null, recChunks = [];
function startRecording() {
  try {
    const stream = cv.captureStream(FPS);
    const mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9") ? "video/webm;codecs=vp9" : "video/webm";
    recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12_000_000 });
    recorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
    recorder.onstop = () => {
      const blob = new Blob(recChunks, { type: "video/webm" });
      const a = document.getElementById("dl");
      a.href = URL.createObjectURL(blob); a.style.display = "inline-block";
      window.__WBA_CLIP__ = blob;
      window.__WBA_DONE__ = true;
    };
    recorder.start();
  } catch (e) { console.warn("recording unavailable", e); }
}
function stopRecording() { if (recorder && recorder.state !== "inactive") recorder.stop(); }

// --- WebCodecs encode path (driven by the Node recorder) -------------
const WC_MODE = Q.get("encode") === "wc";
const wc = { enc: null, chunks: [], n: 0, ok: false, error: null, flushed: false };
window.__WBA_WC__ = wc;
if (WC_MODE && typeof VideoEncoder !== "undefined") {
  try {
    wc.enc = new VideoEncoder({
      output: (chunk) => {
        const b = new Uint8Array(chunk.byteLength);
        chunk.copyTo(b);
        wc.chunks.push(b);
      },
      error: (e) => { wc.error = String(e); console.error("VideoEncoder error", e); },
    });
    wc.enc.configure({
      codec: "avc1.640028",              // H.264 High 4.0
      width: W, height: H,
      bitrate: 5_500_000, framerate: FPS,
      avc: { format: "annexb" },
      // "realtime": emit each frame promptly with a shallow internal queue.
      // "quality" lets the encoder buffer/look-ahead, which under the Node
      // driver's batched pull loop snowballs into a multi-second-per-frame
      // stall on longer clips. The bitrate ceiling keeps quality fine.
      latencyMode: "realtime",
    });
    wc.ok = true;
  } catch (e) { wc.error = String(e); console.error("WebCodecs configure failed", e); }
}
// pull encoded bytes out to Node in base64 batches (called via page.evaluate)
window.__WBA_WC_PULL__ = (max) => {
  const take = wc.chunks.splice(0, max || 120);
  return take.map((u) => {
    let s = ""; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000));
    return btoa(s);
  });
};
window.__WBA_WC_STATE__ = () => ({ ok: wc.ok, error: wc.error, pending: wc.chunks.length, encoded: wc.n, flushed: wc.flushed });
window.__WBA_WC_FLUSH__ = async () => { if (wc.enc) { try { await wc.enc.flush(); } catch (e) { wc.error = String(e); } } wc.flushed = true; return window.__WBA_WC_STATE__(); };

function wcEncodeFrame() {
  if (!wc.ok) return;
  const frame = new VideoFrame(cv, { timestamp: Math.round(wc.n * 1e6 / FPS), duration: Math.round(1e6 / FPS) });
  wc.enc.encode(frame, { keyFrame: wc.n % (FPS * 2) === 0 });
  frame.close();
  wc.n++;
}

// ---------------------------------------------------------------------
// Game loop
//   Playable mode : wall-clock accumulator (feels right for a human).
//   Director mode : FIXED sim-time per rendered frame, wall-clock
//     independent -> byte-identical output for a given seed, and a
//     browser that throttles requestAnimationFrame can't slow the
//     match down. An external recorder (Node + Playwright) can also
//     drive it one frame at a time via window.__WBA_TICK__().
// ---------------------------------------------------------------------
const STEPS_PER_FRAME = Math.max(1, Math.round((1 / FPS) / DT));   // sim steps per output frame
const OVER_HOLD_FRAMES = Math.round(2.6 * FPS);                    // linger on the winner card
const HARD_CAP_FRAMES  = Math.round((INTRO_SECONDS + BATTLE_MAX_SECONDS + 5) * FPS);
// EXTERNAL is declared with the other run-config consts near the top
if (AUTO) { const h = document.getElementById("hint"); if (h) h.hidden = true; }  // clean frames for the recorder

// release-fund panel — real players only, never on recorded frames
const fundEl = document.getElementById("fund");
if (!AUTO && FUND_URL) {
  document.getElementById("fundLink").href = FUND_URL;
}
const hintEl = document.getElementById("hint");
function updateFund() {
  if (fundEl) {
    // only after a match, when a real player is most receptive; never on video
    const show = !AUTO && FUND_URL && world.state === "over" && world.t > 0.8;
    fundEl.style.display = show ? "block" : "none";
  }
  // the play hint belongs on the fight screen only
  if (hintEl && !AUTO) hintEl.hidden = world.state !== "fight";
}

let world = new World();
let acc = 0, last = performance.now(), overHold = 0, prevState = "intro";
let outFrame = 0, lastBeep = null;

window.__WBA_STATE__ = () => ({ state: world.state, t: world.t, frame: outFrame,
  winner: world.winner && world.winner.name, done: !!window.__WBA_DONE__, seed: SEED });
window.__WBA_META__ = () => ({
  seed: SEED, theme: world.theme.name,
  fighters: world.fighters.map(f => ({ name: f.name, kind: f.kind, tint: f.tint,
    hp: Math.max(0, Math.round(f.hp)), alive: f.alive, isWinner: f === world.winner,
    role: f._role || undefined, kills: f.kills || 0 })),
  winner: world.winner && world.winner.name,
  winnerKind: world.winner && world.winner.kind,
  winnerHp: world.winner ? Math.max(0, Math.round(world.winner.hp)) : null,
  winnerKills: world.winner ? (world.winner.kills || 0) : null,
  mutator: MUT ? MUT.name : null,
  mutatorId: MUT ? MUT.id : null,
  hazard: world.hazard ? HAZARD_NAME[world.hazard] : null,
  hazardId: world.hazard || null,
  pickups: world.pickupLog || [],
  finishText: world.finishText, hits: world.hits, n: world.n,
});
// full synth-audio timeline for the Node-side mixer (record/audio.js)
window.__WBA_AUDIO_LOG__ = () => ({ fps: FPS, clock: +world.clock.toFixed(3), events: world.audioLog });

function beepCountdown() {
  const lbl = countdownLabel(world.t);
  if (lbl !== lastBeep) {
    lastBeep = lbl;
    const big = lbl === "FIGHT!";
    sfx.count(big ? 0 : 1);
    world._logSfx("count", { big });
  }
}

// advance EXACTLY one output frame of the simulation, then draw it.
function tick() {
  if (world.hitstop > 0) {
    world.hitstop -= 1 / FPS;                 // freeze the sim, keep drawing (juice)
    world.clock += 1 / FPS;                   // ...but output time still advances (keeps audio log in sync)
  } else if (world.slowmo > 0) {
    // final-KO slow motion — one small sim step per frame (~3.5x slower)
    world.slowmo -= 1 / FPS;                  // count down in REAL time
    world.step(DT * (2 / 7), input);
    world.clock += 1 / FPS - DT * (2 / 7);    // top clock back up so audio stays aligned
  } else {
    for (let s = 0; s < STEPS_PER_FRAME; s++) {
      world.step(DT, input);
      if (world.state === "intro") beepCountdown();
      if (world.hitstop > 0) break;
    }
  }
  if (world.state !== prevState) {
    if (world.state === "over") { sfx.win(); world._logSfx("win", {}); }
    prevState = world.state;
  }
  render(world);
  if (WC_MODE) wcEncodeFrame();
  outFrame++;

  if (world.state === "over") {
    overHold++;
    if (overHold >= OVER_HOLD_FRAMES && !window.__WBA_DONE__) { stopRecording(); window.__WBA_DONE__ = true; }
  }
  if (outFrame > HARD_CAP_FRAMES && !window.__WBA_DONE__) { stopRecording(); window.__WBA_DONE__ = true; }
  return window.__WBA_STATE__();
}
window.__WBA_TICK__ = tick;

function restart() {
  const u = new URL(location.href);
  u.searchParams.set("seed", (Math.random() * 2 ** 31) >>> 0);
  location.href = u.toString();
}
// tap / key to interact with the menu, or replay after a match
function advanceFromUI() {
  if (world.state === "menu") { menuHit(input.aimX, input.aimY); return true; }
  if (world.state === "over" && world.t > 0.6) { maybeShowAd(restart); return true; }
  return false;
}

function frameAuto() {           // director: one fixed frame per rAF, no wall clock
  tick();
  if (!window.__WBA_DONE__) requestAnimationFrame(frameAuto);
}

function framePlay(now) {        // playable: wall-clock accumulator
  let dtReal = (now - last) / 1000; last = now;
  if (dtReal > 0.25) dtReal = 0.25;
  if (world.state === "menu") { world._stepAmbient(dtReal); render(world); updateFund(); return requestAnimationFrame(framePlay); }
  if (world.hitstop > 0) {
    world.hitstop -= dtReal; acc = 0;
  } else if (world.slowmo > 0) {
    world.slowmo -= dtReal; acc = 0;
    world.step(dtReal * (2 / 7), input);
  } else {
    acc += dtReal;
    let steps = 0;
    while (acc >= DT && steps < 24) {
      world.step(DT, input); acc -= DT; steps++;
      if (world.state === "intro") beepCountdown();
      if (world.hitstop > 0) { acc = 0; break; }
    }
  }
  if (world.state !== prevState) {
    if (world.state === "over") { sfx.win(); adState.matches++; try { localStorage.setItem("wba_m", String(adState.matches)); } catch (e) {} }
    prevState = world.state;
  }
  render(world);
  updateFund();
  requestAnimationFrame(framePlay);
}

if (!AUTO && !EXTERNAL) { world.state = "menu"; prevState = "menu"; }
if (AUTO && RECORD) startRecording();
if (EXTERNAL) {
  window.__WBA_READY__ = true;   // Node driver calls window.__WBA_TICK__() itself
} else if (AUTO) {
  requestAnimationFrame(frameAuto);
} else {
  requestAnimationFrame(framePlay);
}
</script>
</body>
</html>
