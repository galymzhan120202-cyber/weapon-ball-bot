<script>
"use strict";
/* =====================================================================
   Weapon Ball Arena — single-file HTML5 canvas game (hybrid)
   - Playable: steer one weapon-ball, outlast AI opponents in a
     shrinking arena. Last one alive wins.
   - Director mode (?auto=1&seed=123): all-AI, fully deterministic from
     the seed, optional MediaRecorder capture for YouTube Shorts.
   Mechanics (weapon roster, damage formula, arena themes, "lunge" AI)
   are ported from weapon-ball-bot / battle_sim.py so the tuning work
   already done there carries straight over.
   ===================================================================== */

// ---------------------------------------------------------------------
// URL params / run config
// ---------------------------------------------------------------------
const Q = new URLSearchParams(location.search);
const AUTO      = Q.get("auto") === "1";
const RECORD    = Q.get("record") === "1";
const SEED      = (Q.get("seed") != null) ? (parseInt(Q.get("seed"), 10) >>> 0)
                                          : (Math.random() * 2 ** 31) >>> 0;
const FORCE_N   = Q.get("n") ? Math.max(2, Math.min(8, parseInt(Q.get("n"), 10))) : null;
// weapons: ?weapons=sword,axe  — or the thumbnail-style ?a=Sword&b=Axe
//          (lets a pinned-comment vote pick the next matchup via the URL)
const PICK_LIST = Q.get("weapons")
  ? Q.get("weapons").split(",").map(s => s.trim().toLowerCase())
  : (Q.get("a") && Q.get("b")) ? [Q.get("a").trim().toLowerCase(), Q.get("b").trim().toLowerCase()] : null;
const MUTED     = AUTO ? (Q.get("sound") !== "1") : (Q.get("mute") === "1");
const DEBUG     = Q.get("debug") === "1";   // show seed / dev details on screen
const EXTERNAL  = Q.get("drive") === "ext"; // Node recorder drives the clock via __WBA_TICK__

// Release-fund donation link — shown to real players (never on recorded
// frames). Ko-fi tips are pay-what-you-want. Empty = hidden.
const FUND_URL  = "https://ko-fi.com/weaponballarena";

// ---------------------------------------------------------------------
// Ads — a short video ad between matches, real players only. Provider-
// agnostic hook: set AD_PROVIDER + AD_GAME_ID once you have an account.
//   ""            -> ads off (default; nothing loads)
//   "gamemonetize"-> AD_GAME_ID = your GameMonetize game id (a UUID)
//   "crazygames"  -> AD_GAME_ID unused; needs the CrazyGames SDK
// Never runs in AUTO / EXTERNAL (recorder) — the SDK isn't even loaded.
// ---------------------------------------------------------------------
const AD_PROVIDER = Q.get("ads") === "0" ? "" : "gamemonetize";  // "" | "gamemonetize" | "crazygames"
const AD_GAME_ID  = "7b7tf8jlqx6b4inrvvl9d2wnul50y6nv";           // GameMonetize game id
const AD_MIN_GAP  = 90;      // seconds between ads
const AD_EVERY    = 2;       // show at most once per N finished matches
const AD_ENABLED  = !AUTO && !EXTERNAL && !!AD_PROVIDER;
// match count + last-ad time persist across the per-match page reload
const adState = {
  loading: false, ready: false,
  matches: (() => { try { return parseInt(localStorage.getItem("wba_m") || "0", 10) || 0; } catch (e) { return 0; } })(),
  last:    (() => { try { return parseInt(localStorage.getItem("wba_ad") || "0", 10) || 0; } catch (e) { return 0; } })(),
};

(function bootAdSdk() {
  if (!AD_ENABLED) return;
  try {
    if (AD_PROVIDER === "gamemonetize") {
      window.SDK_OPTIONS = {
        gameId: AD_GAME_ID, prefixAds: false,
        onEvent: (a) => { if (a && (a.name === "SDK_READY" || a.name === "SDK_GAME_START")) adState.ready = true; },
      };
      const s = document.createElement("script");
      s.src = "https://api.gamemonetize.com/sdk.js"; s.async = true;
      s.onerror = () => { adState.ready = false; };
      document.head.appendChild(s);
    } else if (AD_PROVIDER === "crazygames") {
      const s = document.createElement("script");
      s.src = "https://sdk.crazygames.com/crazygames-sdk-v3.js"; s.async = true;
      s.onload = () => {
        try { window.CrazyGames.SDK.init().then(() => { adState.ready = true; }).catch(() => {}); }
        catch (e) {}
      };
      document.head.appendChild(s);
    }
  } catch (e) { /* ads are best-effort */ }
})();

// Play a between-match ad if one is due, then call `done`. Never blocks:
// a stuck/failed ad falls through after a short timeout.
function maybeShowAd(done) {
  const now = Date.now();
  const due = AD_ENABLED && adState.ready && !adState.loading
    && adState.matches > 0 && adState.matches % AD_EVERY === 0
    && (now - adState.last) > AD_MIN_GAP * 1000;
  if (!due) { done(); return; }
  adState.loading = true;
  let fired = false;
  const finish = () => {
    if (fired) return; fired = true;
    clearTimeout(guard);
    adState.loading = false;
    try { localStorage.setItem("wba_ad", String(Date.now())); } catch (e) {}
    done();
  };
  const guard = setTimeout(finish, 12000);
  try {
    if (AD_PROVIDER === "gamemonetize" && window.sdk && window.sdk.showBanner) {
      const p = window.sdk.showBanner();
      if (p && p.then) p.then(finish, finish); else setTimeout(finish, 4000);
    } else if (AD_PROVIDER === "crazygames" && window.CrazyGames && window.CrazyGames.SDK) {
      window.CrazyGames.SDK.ad.requestAd("midgame", { adFinished: finish, adError: finish });
    } else { finish(); }
  } catch (e) { finish(); }
}

// ---------------------------------------------------------------------

const MENU = {

const W = 1080, H = 1920;
const DT = 1 / 120;                 // fixed physics step (determinism)
const FPS = 60;                     // render / capture frame rate
let   START_HP = 100;               // `let`: a MUTATOR may scale it before the World is built
const INTRO_SECONDS = 3.0;          // 3 · 2 · 1 · FIGHT! countdown
const COLD_OPEN = 0;                // reserved (battle_sim has a 0.9s hook)
const BATTLE_MAX_SECONDS = 34;
const BATTLE_MIN_SECONDS = 12;
const TRAIL_LEN = 9;               // motion-trail samples per fighter

// ---------------------------------------------------------------------
// Seeded RNG (mulberry32) — every random draw in the sim goes through
// one of these so a seed fully reproduces a match.
// ---------------------------------------------------------------------
function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function hashStr(s) { let h = 2166136261 >>> 0; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
const rng      = mulberry32(SEED);
const critRng  = mulberry32(hashStr(SEED + "crit"));
const parryRng = mulberry32(hashStr(SEED + "parry"));
const rnd  = (a, b) => a + (b - a) * rng();
const rndi = (a, b) => Math.floor(rnd(a, b + 1));
function pick(arr) { return arr[Math.floor(rng() * arr.length)]; }
function sample(arr, k) { const p = arr.slice(); for (let i = p.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [p[i], p[j]] = [p[j], p[i]]; } return p.slice(0, k); }
function weightedPick(entries) { // [[val,w],...]
  let tot = 0; for (const e of entries) tot += e[1];
  let r = rng() * tot;
  for (const e of entries) { if ((r -= e[1]) <= 0) return e[0]; }
  return entries[entries.length - 1][0];
}

// ---------------------------------------------------------------------

//   zone     -> active damage point(s), local offset (x,y) + radius,
//               in units of the fighter's own collision radius.
//               y<0 points toward the drawn tip. null => whole body active.
// ---------------------------------------------------------------------
const MAT = {

const ZONE_SCALE = 1.22;
const ROSTER = [

// World is built — the roll happens up front so determinism is intact.

  shield:  { name: "SHIELD",  color: "#5aa0ff", glyph: "S", desc: "blocks 3 hits" },
  heal:    { name: "HEAL",    color: "#2effa0", glyph: "+", desc: "+35 HP" },
  berserk: { name: "BERSERK", color: "#ffcf4a", glyph: "B", desc: "1.7× speed" },
  bomb:    { name: "BOMB",    color: "#ff7a2f", glyph: "X", desc: "next hit explodes" },
};
const PICKUP_IDS = Object.keys(PICKUP);
const PICKUPS_ON = Q.get("pickups") !== "0";
const pickRng = mulberry32(hashStr(SEED + "pickup"));

// ---------------------------------------------------------------------
// ARENA HAZARDS — one per theme (rolled ~58%). Visual variety + swing
// moments so 90 fights a month don't blur together. Seed-driven.
// ---------------------------------------------------------------------
const THEME_HAZARD = {
  "Lava Pit": "pit", "Volcanic Forge": "pit", "Radioactive Waste": "pit",
  "Cyber Grid": "pegs", "Neon City": "pegs", "Midnight Arena": "pegs",
  "Toxic Lab": "saw", "Deep Space": "saw", "Golden Temple": "saw",
  "Storm Clouds": "wind", "Desert Dunes": "wind", "Sunset Coliseum": "wind",
  "Ice Cave": "ice", "Frozen Peak": "ice",
};
const HAZARD_NAME = { pit: "LAVA PIT", pegs: "BUMPERS", saw: "SAW BLADE", wind: "CROSSWIND", ice: "ICE FLOOR" };
const HAZARDS_ON = Q.get("hz") !== "0";
const hazRng = mulberry32(hashStr(SEED + "hazard"));

// ---------------------------------------------------------------------
// WEAPON IDENTITY — per-kind behaviour so "Chainsaw vs Rapier" plays
// nothing like "Axe vs Sword". Checked at the point of use.
//   cd    : re-hit cooldown multiplier (fast daggers / slow hammers)
//   knock : extra shove on a clean hit
//   crit/parry : added chance when this weapon is involved
//   dot   : chainsaw grind — damage/sec while in contact
//   pull  : reel the victim in on a clean hit (whip family)
//   proj  : this weapon throws a projectile {speed,dmg,cd,returns,col,spin}
// ---------------------------------------------------------------------
const TRAIT = {
  // balance pass 1 (2026-09-04, from a 180-match base sweep): ranged +
  // chainsaw + hammer-knock were dominating, fast/low-power weapons were
  // losing 100% — projectiles and DoT nerfed hard, knock brought down.
  // balance pass 3: chainsaw DoT + ranged still 100%, daggers still ~0%.
  // DoT is now a tiny burst, projectiles are chip-only, the dagger "faster
  // re-hit" trait was hurting them (short reach) so it's dropped and their
  // power carries it. Blunt knock removed — cosmetic only via the elastic
  // collision now.
  chainsaw:     { dot: 3, cd: 1.6 },
  hammer:       { cd: 1.1 },
  warhammer:    { cd: 1.15 },
  mace:         { cd: 1.08 },
  flail:        { cd: 1.05 },
  rapier:       { crit: 0.10, parry: 0.12 },
  katana:       { crit: 0.09, parry: 0.09 },
  whip:         { pull: 240 },
  pistol:       { proj: { speed: 1500, dmg: 4, cd: 5.0, returns: false, col: "#ffd27a", spin: 0 } },
  shuriken:     { proj: { speed: 1150, dmg: 4, cd: 3.2, returns: false, col: "#ff4d6a", spin: 46 } },
  boomerang:    { proj: { speed: 950,  dmg: 4, cd: 3.2, returns: true,  col: "#e0b070", spin: 34 } },
};

// ---------------------------------------------------------------------
// small vec + color helpers
// ---------------------------------------------------------------------
const len = (x, y) => Math.hypot(x, y);
function norm(x, y) { const l = Math.hypot(x, y) || 1; return [x / l, y / l]; }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

function hexToRgb(hex) {
  const c = hex.replace("#", "");
  return [parseInt(c.substr(0, 2), 16), parseInt(c.substr(2, 2), 16), parseInt(c.substr(4, 2), 16)];
}
function rgbToHex(r, g, b) {
  return "#" + [r, g, b].map(v => clamp(Math.round(v), 0, 255).toString(16).padStart(2, "0")).join("");
}
function hslToRgb(h, s, l) {
  const k = n => (n + h * 12) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, 9 - k(n), 1));
  return [f(0) * 255, f(8) * 255, f(4) * 255];
}
function rgbToHsl(r, g, b) {
  r /= 255; g /= 255; b /= 255;
  const mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn;
  let h = 0;
  if (d) {
    if (mx === r) h = ((g - b) / d) % 6;
    else if (mx === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h /= 6; if (h < 0) h += 1;
  }
  const l = (mx + mn) / 2;
  const s = d ? d / (1 - Math.abs(2 * l - 1)) : 0;
  return [h, s, l];
}
function mixHex(hexA, hexB, t) {
  const a = hexToRgb(hexA), b = hexToRgb(hexB);
  return rgbToHex(a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t);
}
// keep a weapon's identity tint but force a screen-distinct, readable hue
function distinctTint(hex, hue) {
  const [, , l0] = rgbToHsl(...hexToRgb(hex));
  const target = rgbToHex(...hslToRgb(hue, 0.60, clamp(l0 * 0.5 + 0.32, 0.42, 0.66)));
  return mixHex(hex, target, 0.62);
}

// ---------------------------------------------------------------------
// World / simulation
// ---------------------------------------------------------------------
class Fighter {
  constructor(def, x, y) {
    Object.assign(this, def);
    this.x = x; this.y = y; this.vx = 0; this.vy = 0;
    this.angle = rnd(0, Math.PI * 2);
    this.spin = rnd(-6, 6);
    this.hp = START_HP; this.chipHp = START_HP; this.maxHp = START_HP; this.alive = true;
    this.kills = 0;
    this._role = "";                                  // GIANT / GOBLIN tag (giants mutator)
    this.buff = null;                                 // active pickup buff {id,name,t,...}
    this.shield = 0;                                  // hits the SHIELD pickup still absorbs
    this.mass = 0.80 + (this.power - 0.80) * 0.55;   // compressed (ported)
    this.hitFlash = 0; this.scale = 1;
    this.lungeCd = rnd(0.6, 1.6);
    this._projCd = TRAIT[this.kind] && TRAIT[this.kind].proj ? rnd(1.2, 2.4) : 0;
    this._dot = null;  // {by, dps, t} chainsaw grind
    this.eDmg = 0;      // accumulated damage popup
    this.dmgPopT = 0;
    this.trail = [];   // recent {x,y} for the motion trail
    this.tint = this.color;   // screen-distinct color, set by World
  }
  get baseR() { return this._baseR; }
}

class World {
  constructor() {
    this.t = 0;
    this.clock = 0;                  // monotonic output-time clock (never reset) — audio-log timestamps
    this.audioLog = [];             // [{t, type, ...}] for the Node-side sfx/music mix
    this.state = "intro";            // intro -> fight -> over
    this.theme = pick(THEMES);
    this.winner = null;
    this.finishText = "";
    this.pairCd = new Map();         // "i,j" -> cooldown
    this.sparks = [];
    this.rings = [];                 // expanding impact rings
    this.shards = [];               // weapon-piece debris from a KO
    this.confetti = [];            // winner-card confetti
    this.projectiles = [];        // pistol / shuriken / boomerang shots
    this.shakes = 0;
    this.flash = 0;
    this.hitstop = 0;               // brief freeze on big hits (juice)
    this.slowmo = 0;               // seconds of slow-motion left (final-KO beat)
    this.zoom = 1;                  // render-side camera punch on finish
    this.callout = null;            // {txt, t} big screen callout
    this.killCount = 0; this.lastKillT = -9;

    // roster selection — URL picks (recorder / share links) first, then the
    // playable-mode MENU choices, then a weighted random matchup.
    const useMenu = !AUTO && !EXTERNAL;
    let picked = null;
    if (PICK_LIST) {
      const chosen = PICK_LIST.map(k => ROSTER.find(w => w.kind === k || w.name.toLowerCase() === k)).filter(Boolean);
      if (chosen.length >= 2) picked = chosen.slice(0, 8);
    } else if (useMenu && (MENU.pickA || MENU.pickB)) {
      const want = MENU.n;
      const fixed = [MENU.pickA, MENU.pickB].map(k => k && ROSTER.find(w => w.kind === k)).filter(Boolean);
      const pool = ROSTER.filter(w => !fixed.includes(w));
      picked = fixed.concat(sample(pool, Math.max(0, want - fixed.length))).slice(0, want);
    }
    if (picked) this.defs = picked;
    else this.defs = sample(ROSTER, FORCE_N || (useMenu ? MENU.n : weightedPick([[2, 55], [3, 28], [4, 17]])));
    const n = this.defs.length;
    this.n = n;

    // arena box
    this.cx = W / 2; this.cy = H * 0.56;
    this.arenaR0 = Math.min(W, H) * 0.44;
    this.arenaR = this.arenaR0;
    this.arenaRmin = this.arenaR0 * 0.42;

    // sizing by fighter count (ported spirit of RADIUS_BY_N)
    const baseR = ({ 2: 62, 3: 54, 4: 47, 5: 42, 6: 38, 7: 35, 8: 33 })[n] || 40;

    this.fighters = this.defs.map((def, i) => {
      const ang = (i / n) * Math.PI * 2 + rnd(0, Math.PI * 2);
      const spawnR = this.arenaR0 * 0.62;
      const f = new Fighter(def, this.cx + Math.cos(ang) * spawnR, this.cy + Math.sin(ang) * spawnR);
      f._baseR = baseR * def.reach;
      const speed0 = Math.min(W, H) * 0.16;
      const [ax, ay] = norm(this.cx - f.x, this.cy - f.y);
      f.vx = ax * speed0; f.vy = ay * speed0;
      f.idx = i;
      return f;
    });

    // screen-distinct colors: evenly spaced hues (seed-rotated) so a
    // Sword / Rapier / Claws fight isn't three identical white balls,
    // while each keeps a hint of its own identity tint.
    const hue0 = rng();
    this.fighters.forEach((f, i) => { f.tint = distinctTint(f.color, (hue0 + i / n) % 1); });

    // drifting ambient particles (theme-tinted), purely decorative
    this.ambient = [];
    for (let i = 0; i < 46; i++) {
      this.ambient.push({
        x: rnd(0, W), y: rnd(0, H),
        vx: rnd(-14, 14), vy: rnd(-22, -6),
        r: rnd(1.5, 4.5), a: rnd(0.06, 0.22),
      });
    }

    // player is fighter 0 unless AUTO
    this.playerIdx = (AUTO || EXTERNAL || MENU.mode === "watch") ? -1 : 0;
    this.hits = 0;
    this.mutator = MUT;

    // ---- pickup schedule (seed-driven) ----
    this.pickups = [];            // live orbs in the arena
    this.pickupLog = [];          // [{by, buff}] for meta / description
    this.pendingPickups = [];
    if (PICKUPS_ON && this.n <= 3) {
      const nP = pickRng() < 0.22 ? 0 : (pickRng() < 0.72 ? 1 : 2);
      for (let i = 0; i < nP; i++) {
        const at = 3.2 + i * 5.5 + pickRng() * 3.0;                    // seconds into the fight
        const ang = pickRng() * Math.PI * 2, rad = this.arenaR0 * (0.12 + pickRng() * 0.42);
        const id = PICKUP_IDS[Math.floor(pickRng() * PICKUP_IDS.length)];
        this.pendingPickups.push({ at, x: this.cx + Math.cos(ang) * rad, y: this.cy + Math.sin(ang) * rad, id });
      }
    }

    // let a mutator reshape the fighters now that they exist
    if (MUT && MUT.world) MUT.world(this);

    // ---- arena hazard ----
    this.hazard = null;
    if (HAZARDS_ON) {
      const forced = Q.get("hz");
      if (forced != null) this.hazard = forced === "0" ? null : forced;
      else if (hazRng() < 0.58) this.hazard = THEME_HAZARD[this.theme.name] || null;
    }
    this._initHazard();
  }

  _initHazard() {
    this.haz = {};
    const R0 = this.arenaR0;
    if (this.hazard === "pit") {
      this.haz.pitR = R0 * 0.24;
    } else if (this.hazard === "pegs") {
      this.haz.pegs = [];
      const n = 7;
      for (let i = 0; i < n; i++) {
        const ang = (i / n) * Math.PI * 2 + hazRng() * 1.2;
        const rad = R0 * (0.28 + hazRng() * 0.36);
        this.haz.pegs.push({ x: this.cx + Math.cos(ang) * rad, y: this.cy + Math.sin(ang) * rad, r: 22 });
      }
    } else if (this.hazard === "saw") {
      this.haz.saw = { a: hazRng() * Math.PI, phase: hazRng() * 6.28, speed: 1.5 + hazRng() * 0.7, span: R0 * 0.86, r: 34, rot: 0 };
    } else if (this.hazard === "wind") {
      this.haz.wind = { a: hazRng() * Math.PI * 2, turn: (hazRng() - 0.5) * 0.5, force: 520, streaks: [] };
      for (let i = 0; i < 26; i++) this.haz.wind.streaks.push({ x: rng() * W, y: rng() * H, len: rnd(18, 44) });
    } else if (this.hazard === "ice") {
      DRAG = 0.055; FRICTION_MULT *= 0.4;
    }
  }

  living() { return this.fighters.filter(f => f.alive); }

  _stepAmbient(dt) {
    for (const p of this.ambient) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      if (p.y < -10) { p.y = H + 10; p.x = rnd(0, W); }
      if (p.x < -10) p.x = W + 10; else if (p.x > W + 10) p.x = -10;
    }
  }

  _logSfx(type, data) {
    if (this.audioLog.length < 6000)
      this.audioLog.push(Object.assign({ t: +this.clock.toFixed(3), type }, data));
  }

  step(dt, input) {
    this._stepAmbient(dt);
    if (this.state === "menu") return;
    this.clock += dt;
    if (this.state === "intro") {
      this.t += dt;
      if (this.t >= INTRO_SECONDS) { this.state = "fight"; this.t = 0; }
      // let them drift gently during countdown
      for (const f of this.fighters) {
        f.x += f.vx * dt * 0.22; f.y += f.vy * dt * 0.22;
        f.trail.push({ x: f.x, y: f.y }); if (f.trail.length > TRAIL_LEN) f.trail.shift();
        this._confine(f, dt, true);
      }
      return;
    }
    if (this.state === "over") {
      this.t += dt;
      this.zoom += (1 - this.zoom) * Math.min(1, dt * 2.5);
      this.shakes *= (1 - 6 * dt);
      this.flash = Math.max(0, this.flash - dt * 2);
      for (const p of this.sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= (1 - 2 * dt); p.vy *= (1 - 2 * dt); p.life -= dt; }
      this.sparks = this.sparks.filter(p => p.life > 0);
      for (const r of this.rings) { r.rr += r.spd * dt; r.life -= dt; }
      this.rings = this.rings.filter(r => r.life > 0);
      for (const s of this.shards) { s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 900 * dt; s.vx *= (1 - 0.6 * dt); s.rot += s.spin * dt; s.life -= dt; }
      this.shards = this.shards.filter(s => s.life > 0);
      for (const c of this.confetti) { c.x += c.vx * dt; c.y += c.vy * dt; c.vy += 120 * dt; c.rot += c.spin * dt; }
      this.confetti = this.confetti.filter(c => c.y < H + 40);
      return;
    }

    this.t += dt;

    // shrink arena from min->max seconds (SHRINK_MULT closes it faster)
    const s0 = BATTLE_MIN_SECONDS * 0.5, s1 = BATTLE_MAX_SECONDS;
    const k = Math.max(0, Math.min(1, (this.t - s0) / ((s1 - s0) / SHRINK_MULT)));
    this.arenaR = this.arenaR0 + (this.arenaRmin - this.arenaR0) * k;

    // ---- AI + player control ----
    for (const f of this.fighters) {
      if (!f.alive) continue;
      if (f.idx === this.playerIdx) this._controlPlayer(f, dt, input);
      else this._controlAI(f, dt);
      f.lungeCd -= dt;
    }

    // ---- integrate ----
    for (const f of this.fighters) {
      if (!f.alive) continue;
      f.x += f.vx * dt; f.y += f.vy * dt;
      f.angle += f.spin * dt;
      f.spin *= (1 - 0.35 * dt);
      // mild drag so fights don't runaway-accelerate
      f.vx *= (1 - DRAG * dt); f.vy *= (1 - DRAG * dt);
      f.hitFlash = Math.max(0, f.hitFlash - dt * 4);
      f.scale += (1 - f.scale) * Math.min(1, dt * 12);
      if (f.dmgPopT > 0) f.dmgPopT -= dt;
      // buff timer + REGEN mutator + HEAL buff
      if (f.buff) { f.buff.t -= dt; if (f.buff.t <= 0) f.buff = null; }
      const regen = REGEN_PER_SEC + (f.buff && f.buff.id === "heal" ? f.buff.rate : 0);
      if (regen > 0 && f.hp > 0) f.hp = Math.min(f.maxHp, f.hp + regen * dt);
      // chainsaw grind DoT
      if (f._dot) {
        f._dot.t -= dt; f.hp -= f._dot.dps * dt;
        f.hitFlash = Math.max(f.hitFlash, 0.3);
        const by = f._dot.by;
        if (f._dot.t <= 0) f._dot = null;
        if (f.hp <= 0) { this._kill(f, by); continue; }
      }
      f.chipHp += (f.hp - f.chipHp) * Math.min(1, dt * 3.5);   // chip-damage trail
      f.trail.push({ x: f.x, y: f.y });
      if (f.trail.length > TRAIL_LEN) f.trail.shift();
      this._confine(f, dt, false);
    }

    // ---- collisions (pairwise) ----
    const L = this.living();
    for (let a = 0; a < L.length; a++) {
      for (let b = a + 1; b < L.length; b++) this._collide(L[a], L[b], dt);
    }
    // decay pair cooldowns
    for (const [key, v] of this.pairCd) {
      const nv = v - dt;
      if (nv <= 0) this.pairCd.delete(key); else this.pairCd.set(key, nv);
    }

    // ---- pickups ----
    this._stepPickups(dt);

    // ---- thrown weapons (pistol / shuriken / boomerang) ----
    this._stepWeapons(dt);

    // ---- arena hazard ----
    if (this.hazard) this._stepHazard(dt);

    // ---- storm (outside-arena chip damage) ----
    for (const f of this.living()) {
      const d = len(f.x - this.cx, f.y - this.cy);
      if (d > this.arenaR - f._baseR * 0.4) {
        f.hp -= 9 * dt;
        f.hitFlash = Math.max(f.hitFlash, 0.35);
        if (f.hp <= 0) this._kill(f);           // storm kill — no killer credit
      }
    }

    // ---- sparks / fx ----
    for (const p of this.sparks) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= (1 - 2 * dt); p.vy *= (1 - 2 * dt); p.life -= dt; }
    this.sparks = this.sparks.filter(p => p.life > 0);
    for (const r of this.rings) { r.rr += r.spd * dt; r.life -= dt; }
    this.rings = this.rings.filter(r => r.life > 0);
    this.shakes *= (1 - 6 * dt);
    this.flash = Math.max(0, this.flash - dt * 3);
    if (this.callout) { this.callout.t -= dt; if (this.callout.t <= 0) this.callout = null; }

    // shards (KO debris)
    for (const s of this.shards) {
      s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 900 * dt;
      s.vx *= (1 - 0.6 * dt); s.rot += s.spin * dt; s.life -= dt;
    }
    this.shards = this.shards.filter(s => s.life > 0);

    // ---- win / timeout ----  (hold off while the final-KO slow-mo plays;
    // world.slowmo is counted down in real frame-time by tick())
    const alive = this.living();
    if (alive.length <= 1 && this.t > BATTLE_MIN_SECONDS * 0.4 && this.slowmo <= 0) {
      if (alive.length === 0) { this._finish(this._topHp(), true); this.finishText = "DOUBLE KO!"; }
      else this._finish(alive[0], true);
    } else if (this.t >= BATTLE_MAX_SECONDS) {
      this._finish(this._topHp(), false);
    }
  }

  _shatter(f) {
    const n = 11;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rnd(-0.4, 0.4), sp = rnd(120, 560);
      this.shards.push({
        x: f.x, y: f.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - rnd(40, 200),
        len: rnd(10, 26), rot: rnd(0, 6.28), spin: rnd(-14, 14),
        life: rnd(0.7, 1.25), c: i % 4 ? f.tint : "#ffffff",
      });
    }
  }

  _topHp() { return this.fighters.slice().sort((p, q) => q.hp - p.hp)[0]; }

  _finish(f, byKo) {
    this.state = "over"; this.t = 0; this.winner = f; this.flash = 1; this.shakes = 24;
    this.callout = null; this.slowmo = 0;
    // clear any in-flight damage / tag popups so they don't freeze on the winner card
    for (const g of this.fighters) { g.dmgPopT = 0; g.eDmg = 0; g._tag = null; }
    this.zoom = 1.18;               // render-side punch-in on the winner, eases back
    this.projectiles = [];
    // confetti burst for the winner card
    const cols = [this.theme.accent, "#ffd27a", "#ffffff", f ? f.tint : "#fff", "#5affa0"];
    for (let i = 0; i < 46; i++) {
      this.confetti.push({
        x: rnd(0, W), y: rnd(-120, this.cy - 200),
        vx: rnd(-60, 60), vy: rnd(40, 200),
        w: rnd(6, 14), h: rnd(8, 20), rot: rnd(0, 6.28), spin: rnd(-8, 8),
        c: cols[Math.floor(rng() * cols.length)],
      });
    }
    const clean = ["FLAWLESS!", "DOMINATION!", "UNTOUCHED!"];
    const comeback = ["COMEBACK WIN!", "CLUTCH!", "AGAINST ALL ODDS!"];
    if (byKo && f && f.hp > START_HP * 0.7) this.finishText = pick(clean);
    else if (byKo && f && f.hp < START_HP * 0.25) this.finishText = pick(comeback);
    else this.finishText = byKo ? "WINNER!" : "TIME'S UP — TOP HP WINS";
  }

  _kill(f, killer) {
    if (!f.alive) return;
    f.alive = false; f.hp = 0; f.chipHp = 0;
    if (killer && killer !== f && killer.alive) killer.kills++;
    this._shatter(f);
    this.flash = Math.max(this.flash, 0.85); this.shakes = Math.max(this.shakes, 17);
    this.hitstop = Math.max(this.hitstop, 0.07);
    // the deciding KO gets a real slow-motion beat before the winner card
    if (this.living().length <= 1) { this.slowmo = 0.85; this._slowFocus = { x: f.x, y: f.y }; }
    this.rings.push({ x: f.x, y: f.y, rr: f._baseR, spd: 900, life: 0.5, c: "#fff" });
    for (let i = 0; i < 30; i++) {
      const a = rnd(0, Math.PI * 2), sp = rnd(60, 640);
      this.sparks.push({ x: f.x, y: f.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rnd(0.3, 0.85), c: i % 3 ? f.tint : "#fff" });
    }
    // callouts
    const survivors = this.living().length;
    if (this.t - this.lastKillT < 0.9 && this.killCount >= 1) this.callout = { txt: "DOUBLE KILL!", t: 1.5 };
    else if (this.killCount === 0 && this.n >= 3) this.callout = { txt: "FIRST BLOOD", t: 1.4 };
    else if (survivors === 1 && this.n >= 3) this.callout = { txt: "LAST ONE STANDING", t: 1.6 };
    this.killCount++; this.lastKillT = this.t;
    sfx.ko();
    this._logSfx("ko", {});
    if (this.callout) this._logSfx("callout", { txt: this.callout.txt });
  }

  _confine(f, dt, soft) {
    // circular arena wall bounce
    const dx = f.x - this.cx, dy = f.y - this.cy;
    const d = len(dx, dy);
    const lim = (soft ? this.arenaR0 : this.arenaR) - f._baseR;
    if (d > lim) {
      const [nx, ny] = norm(dx, dy);
      f.x = this.cx + nx * lim; f.y = this.cy + ny * lim;
      const vn = f.vx * nx + f.vy * ny;
      if (vn > 0) { const e = Math.min(1.25, MAT[f.material].elasticity + ELASTIC_BONUS); f.vx -= (1 + e) * vn * nx; f.vy -= (1 + e) * vn * ny; f.spin += rnd(-3, 3); }
    }
  }

  _controlPlayer(f, dt, input) {
    // aim toward pointer, thrust while held
    if (input.aimX != null) {
      const [ax, ay] = norm(input.aimX - f.x, input.aimY - f.y);
      f.angle = Math.atan2(ay, ax) + Math.PI / 2;   // tip (local -y) faces pointer
      if (input.thrust) {
        const push = 2600;
        f.vx += ax * push * dt; f.vy += ay * push * dt;
      }
    }
    // keyboard fallback
    let kx = 0, ky = 0;
    if (input.keys.has("a") || input.keys.has("arrowleft")) kx -= 1;
    if (input.keys.has("d") || input.keys.has("arrowright")) kx += 1;
    if (input.keys.has("w") || input.keys.has("arrowup")) ky -= 1;
    if (input.keys.has("s") || input.keys.has("arrowdown")) ky += 1;
    if (kx || ky) { const [nx, ny] = norm(kx, ky); f.vx += nx * 2200 * dt; f.vy += ny * 2200 * dt; f.angle = Math.atan2(ny, nx) + Math.PI / 2; }
    // clamp speed
    const smax = 1050; const sp = len(f.vx, f.vy);
    if (sp > smax) { f.vx *= smax / sp; f.vy *= smax / sp; }
  }

  _controlAI(f, dt) {
    // seek nearest living enemy
    let tgt = null, best = 1e9;
    for (const o of this.living()) {
      if (o === f) continue;
      const d = len(o.x - f.x, o.y - f.y);
      if (d < best) { best = d; tgt = o; }
    }
    if (!tgt) return;
    const zeal = (f.buff && f.buff.id === "berserk") ? 1.7 : 1;   // BERSERK pickup
    const [dx, dy] = norm(tgt.x - f.x, tgt.y - f.y);
    // steer velocity toward target, face tip at it
    const steer = 900 * zeal;
    f.vx += dx * steer * dt; f.vy += dy * steer * dt;
    f.angle = Math.atan2(dy, dx) + Math.PI / 2;
    // periodic lunge impulse (ported concept)
    if (f.lungeCd <= 0) {
      const victim = pick(this.living().filter(o => o !== f)) || tgt;
      const [lx, ly] = norm(victim.x - f.x, victim.y - f.y);
      const imp = rnd(360, 620) * zeal;
      f.vx += lx * imp; f.vy += ly * imp; f.spin += rnd(-5, 5);
      f.lungeCd = rnd(0.9, 1.9) / zeal;
    }
    // pull back toward center if near the closing wall
    const dc = len(f.x - this.cx, f.y - this.cy);
    if (dc > this.arenaR * 0.86) {
      const [cx, cy] = norm(this.cx - f.x, this.cy - f.y);
      f.vx += cx * 1400 * dt; f.vy += cy * 1400 * dt;
    }
    const smax = 1000 * zeal; const sp = len(f.vx, f.vy);
    if (sp > smax) { f.vx *= smax / sp; f.vy *= smax / sp; }
  }

  // world-space position of a fighter's active zone entry (or body center if none)
  _zonePoints(f) {
    const pts = [];
    const r = f._baseR;
    if (!f.zone) { pts.push({ x: f.x, y: f.y, rr: r, active: true, whole: true }); return pts; }
    const ca = Math.cos(f.angle), sa = Math.sin(f.angle);
    for (const [ox, oy, rf] of f.zone) {
      // local (ox,oy) with -y = tip; rotate by angle
      const lx = ox * r, ly = oy * r;
      const wx = f.x + (lx * ca - ly * sa);
      const wy = f.y + (lx * sa + ly * ca);
      pts.push({ x: wx, y: wy, rr: rf * r * ZONE_SCALE, active: true, whole: false });
    }
    return pts;
  }

  _collide(a, b, dt) {
    const dx = b.x - a.x, dy = b.y - a.y;
    const d = len(dx, dy) || 0.001;
    const rr = a._baseR + b._baseR;
    if (d >= rr) return;

    // --- resolve overlap + elastic impulse (circle bodies) ---
    const [nx, ny] = [dx / d, dy / d];
    const overlap = rr - d;
    const totM = a.mass + b.mass;
    a.x -= nx * overlap * (b.mass / totM); a.y -= ny * overlap * (b.mass / totM);
    b.x += nx * overlap * (a.mass / totM); b.y += ny * overlap * (a.mass / totM);

    const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
    const vn = rvx * nx + rvy * ny;
    if (vn < 0) {
      const e = Math.min(1.25, Math.min(MAT[a.material].elasticity, MAT[b.material].elasticity) + ELASTIC_BONUS);
      let j = -(1 + e) * vn / (1 / a.mass + 1 / b.mass);
      const ix = j * nx, iy = j * ny;
      a.vx -= ix / a.mass; a.vy -= iy / a.mass;
      b.vx += ix / b.mass; b.vy += iy / b.mass;
      // friction -> spin transfer
      const fr = (MAT[a.material].friction + MAT[b.material].friction) * 0.5 * FRICTION_MULT;
      a.spin += (-rvy * nx + rvx * ny) * fr * 0.02;
      b.spin -= (-rvy * nx + rvx * ny) * fr * 0.02;
    }

    // --- damage (only once per pair per cooldown) ---
    // weapon identity: fast daggers shorten it, heavy hammers lengthen it
    const cdMul = Math.min(TRAIT[a.kind] && TRAIT[a.kind].cd || 1, TRAIT[b.kind] && TRAIT[b.kind].cd || 1);
    const key = a.idx < b.idx ? a.idx + "," + b.idx : b.idx + "," + a.idx;
    if (this.pairCd.has(key)) return;
    this.pairCd.set(key, HIT_COOLDOWN * HIT_COOLDOWN_MULT * cdMul);

    // which shape of each was doing the striking? nearest zone point to
    // the contact point on the shared normal.
    const contact = { x: a.x + nx * a._baseR, y: a.y + ny * a._baseR };
    const strike = (f) => {
      let bestActive = false, bestWhole = false, bestD = 1e9;
      for (const p of this._zonePoints(f)) {
        const dd = len(p.x - contact.x, p.y - contact.y) - p.rr;
        if (dd < bestD) { bestD = dd; bestActive = p.active && dd < f._baseR * 0.9; bestWhole = !!p.whole; }
      }
      // body/guard always available as a fallback striker
      return { active: bestActive, whole: bestWhole };
    };
    const sa = strike(a), sb = strike(b);

    // symmetric exchange scaled by crit / parry
    let mult = 1;
    let tag = "";
    const parryChance = Math.max(PARRY_CHANCE,
      PARRY_CHANCE + (TRAIT[a.kind] && TRAIT[a.kind].parry || 0) + (TRAIT[b.kind] && TRAIT[b.kind].parry || 0));
    const critChance = CRIT_CHANCE + (TRAIT[a.kind] && TRAIT[a.kind].crit || 0) + (TRAIT[b.kind] && TRAIT[b.kind].crit || 0);
    if (sa.active && sb.active) { // clash
      if (parryRng() < parryChance) {
        // parry: no damage, hard shove apart
        const shove = 240 * PARRY_KNOCK_MULT;
        a.vx -= nx * shove / a.mass; a.vy -= ny * shove / a.mass;
        b.vx += nx * shove / b.mass; b.vy += ny * shove / b.mass;
        this._spark(contact.x, contact.y, "#ffffff", 18);
        this.rings.push({ x: contact.x, y: contact.y, rr: 6, spd: 720, life: 0.32, c: "#ffffff" });
        this._popBoth(a, b, "PARRY!");
        this.shakes = Math.max(this.shakes, 8);
        this.hitstop = Math.max(this.hitstop, 0.04);
        sfx.parry();
        this._logSfx("parry", {});
        return;
      }
    }
    if (critRng() < critChance) { mult *= CRIT_MULT; tag = "CRITICAL!"; }

    // time-of-fight envelope: soft ramp-in so nobody dies during the
    // opening scramble, gentle ramp-up late so a stalemate resolves.
    const rampIn = Math.min(1, 0.5 + 0.5 * this.t / DMG_RAMP_IN);
    const rampLate = 1 + Math.max(0, (this.t - DMG_RAMP_LATE)) * 0.05;
    const envMult = mult * rampIn * Math.min(1.6, rampLate);

    const dmgTo = (att, vic, attStrike, vicStrike) => {
      let base = BASE_DMG * envMult;
      base *= Math.pow(att.power / vic.power, POWER_DMG_EXPONENT);
      if (attStrike.whole) base *= WHOLE_BODY_DISCOUNT;
      base *= attStrike.active ? ACTIVE_DAMAGE_MULT : GUARD_DAMAGE_MULT;
      if (attStrike.active && !vicStrike.active) base *= CLEAN_HIT_BONUS;
      // impact speed scaling (capped tighter so a fast graze isn't a near-KO)
      base *= 0.7 + Math.min(0.8, Math.abs(vn) / 900);
      if (att.buff && att.buff.id === "rage") base *= 2;          // RAGE pickup
      return base;
    };
    let dA = dmgTo(a, b, sa, sb);   // damage a deals to b
    let dB = dmgTo(b, a, sb, sa);   // damage b deals to a
    // SHIELD pickup — eat the hit, spend a charge
    if (dA > 0 && b.shield > 0) { b.shield--; dA = 0; b._tag = { txt: "BLOCKED", t: 0.7 }; this._spark(contact.x, contact.y, "#5aa0ff", 16); }
    if (dB > 0 && a.shield > 0) { a.shield--; dB = 0; a._tag = { txt: "BLOCKED", t: 0.7 }; this._spark(contact.x, contact.y, "#5aa0ff", 16); }
    b.hp -= dA; a.hp -= dB;
    b.eDmg = Math.round(dA); a.eDmg = Math.round(dB);
    b.dmgPopT = a.dmgPopT = 0.7;
    const clean = sa.active || sb.active;
    a.hitFlash = b.hitFlash = 1; a.scale = b.scale = clean ? 1.18 : 1.1;
    this._spark(contact.x, contact.y, clean ? "#ffd27a" : "#9fb4d6", clean ? 14 : 7);
    this.rings.push({ x: contact.x, y: contact.y, rr: 6, spd: clean ? 640 : 380, life: clean ? 0.34 : 0.22, c: clean ? "#ffe0a0" : "#9fb4d6" });
    this.shakes = Math.max(this.shakes, clean ? 9 : 4);
    this.hits++;
    if (tag) {                                   // crit
      this._popBoth(a, b, tag); this.flash = Math.max(this.flash, 0.45);
      this.hitstop = Math.max(this.hitstop, 0.045);
      this.shakes = Math.max(this.shakes, 13);
    }
    sfx.hit(a.material, b.material, clean);
    this._logSfx("hit", { m1: a.material, m2: b.material, active: clean, crit: !!tag });

    // weapon identity — knockback (hammer family), reel-in (whip family),
    // grind DoT (chainsaw). Applied from the striker onto the victim.
    const idTrait = (att, vic, atkStrike) => {
      const T = TRAIT[att.kind]; if (!T || !atkStrike.active) return;
      if (T.knock) { vic.vx += nx * (att === a ? 1 : -1) * 260 * T.knock; vic.vy += ny * (att === a ? 1 : -1) * 260 * T.knock; vic.spin += rnd(-6, 6); }
      if (T.pull)  { const [px, py] = norm(att.x - vic.x, att.y - vic.y); vic.vx += px * T.pull; vic.vy += py * T.pull; }
      if (T.dot)   { vic._dot = { by: att, dps: T.dot, t: 0.35 }; }
    };
    idTrait(a, b, sa); idTrait(b, a, sb);

    // BOMB pickup — the holder's first real strike detonates
    if (clean && a.buff && a.buff.id === "bomb") { a.buff = null; this._explode(contact.x, contact.y, a); }
    else if (clean && b.buff && b.buff.id === "bomb") { b.buff = null; this._explode(contact.x, contact.y, b); }

    if (b.hp <= 0) this._kill(b, a);
    if (a.hp <= 0) this._kill(a, b);
  }

  _spark(x, y, c, n) {
    for (let i = 0; i < n; i++) {
      const ang = rnd(0, Math.PI * 2), sp = rnd(40, 360);
      this.sparks.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: rnd(0.2, 0.5), c });
    }
  }
  _popBoth(a, b, txt) { a._tag = b._tag = { txt, t: 0.8 }; }

  // ---- pickups ----
  _stepPickups(dt) {
    // release pending orbs once their fight-time arrives
    for (let i = this.pendingPickups.length - 1; i >= 0; i--) {
      if (this.t >= this.pendingPickups[i].at) {
        const q = this.pendingPickups.splice(i, 1)[0];
        // armT: a telegraph window — visible + counting down, not yet grabbable
        this.pickups.push({ x: q.x, y: q.y, id: q.id, r: 30, born: 0, armT: 1.2, bob: rng() * 6.28 });
        this._logSfx("spawn", {});
      }
    }
    for (let i = this.pickups.length - 1; i >= 0; i--) {
      const p = this.pickups[i];
      p.born += dt;
      if (p.armT > 0) { p.armT -= dt; if (p.armT <= 0) { this._spark(p.x, p.y, PICKUP[p.id].color, 14); this._logSfx("spawn", {}); } continue; }
      // pull a stray orb back inside the closing wall so it stays reachable
      const dc = len(p.x - this.cx, p.y - this.cy);
      if (dc > this.arenaR - 50) {
        const [nx, ny] = norm(this.cx - p.x, this.cy - p.y);
        p.x += nx * (dc - (this.arenaR - 50)); p.y += ny * (dc - (this.arenaR - 50));
      }
      // first living ball to touch it grabs it
      for (const f of this.living()) {
        if (len(f.x - p.x, f.y - p.y) < f._baseR + p.r * 0.8) {
          this._grantPickup(f, p.id);
          this.pickups.splice(i, 1);
          break;
        }
      }
    }
  }

  _grantPickup(f, id) {
    const T = PICKUP[id];
    this.pickupLog.push({ by: f.name, buff: T.name });
    this.callout = { txt: f.name.toUpperCase() + " GRABBED " + T.name + "!", t: 1.6 };
    this._spark(f.x, f.y, T.color, 24);
    this.rings.push({ x: f.x, y: f.y, rr: f._baseR, spd: 720, life: 0.4, c: T.color });
    this.flash = Math.max(this.flash, 0.35);
    sfx.pickup(); this._logSfx("pickup", { id, by: f.name });
    if (id === "heal") { f.hp = Math.min(f.maxHp, f.hp + 35); f.buff = { id, name: T.name, t: 2.5, rate: 6 }; }
    else if (id === "shield")  { f.shield = 3; f.buff = { id, name: T.name, t: 10 }; }
    else if (id === "rage")    { f.buff = { id, name: T.name, t: 4.5 }; }
    else if (id === "berserk") { f.buff = { id, name: T.name, t: 4.5 }; }
    else if (id === "bomb")    { f.buff = { id, name: T.name, t: 10 }; }
  }

  _stepWeapons(dt) {
    const L = this.living();
    // fire
    for (const f of L) {
      const T = TRAIT[f.kind]; if (!T || !T.proj) continue;
      f._projCd -= dt;
      if (f._projCd <= 0) {
        let tgt = null, best = 1e9;
        for (const o of L) { if (o === f) continue; const d = len(o.x - f.x, o.y - f.y); if (d < best) { best = d; tgt = o; } }
        if (tgt) {
          const [dx, dy] = norm(tgt.x - f.x, tgt.y - f.y);
          this.projectiles.push({
            x: f.x + dx * f._baseR, y: f.y + dy * f._baseR,
            vx: dx * T.proj.speed, vy: dy * T.proj.speed,
            dmg: T.proj.dmg, col: T.proj.col, spin: T.proj.spin || 0, rot: 0,
            owner: f, returns: !!T.proj.returns, life: 0, back: false, kind: f.kind,
          });
          this._spark(f.x + dx * f._baseR, f.y + dy * f._baseR, T.proj.col, 6);
          sfx.pew(); this._logSfx("pew", {});
          f._projCd = T.proj.cd;
        } else { f._projCd = 0.4; }
      }
    }
    // move + hit + expire
    for (let i = this.projectiles.length - 1; i >= 0; i--) {
      const p = this.projectiles[i];
      p.life += dt; p.rot += (p.spin + 12) * dt;
      if (p.returns && !p.back && (p.life > 0.55 || len(p.x - this.cx, p.y - this.cy) > this.arenaR * 0.9)) p.back = true;
      if (p.back && p.owner.alive) {
        const [hx, hy] = norm(p.owner.x - p.x, p.owner.y - p.y);
        const sp = len(p.vx, p.vy) || 700;
        p.vx += hx * sp * 4 * dt; p.vy += hy * sp * 4 * dt;
        const s2 = len(p.vx, p.vy); if (s2 > sp * 1.3) { p.vx *= sp * 1.3 / s2; p.vy *= sp * 1.3 / s2; }
        if (len(p.x - p.owner.x, p.y - p.owner.y) < p.owner._baseR + 14) { this.projectiles.splice(i, 1); continue; }
      }
      p.x += p.vx * dt; p.y += p.vy * dt;
      let hit = false;
      for (const g of L) {
        if (g === p.owner && !p.back) continue;
        if (g === p.owner) continue;
        if (len(g.x - p.x, g.y - p.y) < g._baseR + 12) {
          const scaled = p.dmg * Math.min(1.15, 0.5 + 0.4 * this.t / DMG_RAMP_IN);
          if (g.shield > 0) { g.shield--; g._tag = { txt: "BLOCKED", t: 0.7 }; }
          else { g.hp -= scaled; g.eDmg = Math.round(scaled); g.dmgPopT = 0.7; g.hitFlash = 1; g.scale = 1.14; }
          const [kx, ky] = norm(p.vx, p.vy);
          g.vx += kx * 220; g.vy += ky * 220;
          this._spark(p.x, p.y, p.col, 12);
          this.rings.push({ x: p.x, y: p.y, rr: 5, spd: 420, life: 0.24, c: p.col });
          this.shakes = Math.max(this.shakes, 6);
          sfx.hit("metal", "metal", true); this._logSfx("hit", { m1: "metal", m2: "metal", active: true });
          if (g.hp <= 0) this._kill(g, p.owner);
          hit = true; break;
        }
      }
      const off = len(p.x - this.cx, p.y - this.cy) > this.arenaR0 + 120;
      if (hit || p.life > 3.2 || (off && !p.returns)) this.projectiles.splice(i, 1);
    }
  }

  _sawPos() {
    const s = this.haz.saw;
    const off = Math.sin(s.phase) * s.span;
    return { x: this.cx + Math.cos(s.a) * off, y: this.cy + Math.sin(s.a) * off };
  }

  _stepHazard(dt) {
    const L = this.living();
    if (this.hazard === "pit") {
      const pr = this.haz.pitR;
      for (const f of L) {
        if (len(f.x - this.cx, f.y - this.cy) < pr + f._baseR * 0.3) {
          f.hp -= 11 * dt; f.hitFlash = Math.max(f.hitFlash, 0.4);
          const [ox, oy] = norm((f.x - this.cx) || 0.01, (f.y - this.cy) || 0.01);
          f.vx += ox * 260 * dt; f.vy += oy * 260 * dt;
          if (this.t % 0.2 < dt) this._spark(f.x, f.y, "#ff7a2f", 4);
          if (f.hp <= 0) this._kill(f);
        }
      }
    } else if (this.hazard === "pegs") {
      for (const f of L) {
        for (const p of this.haz.pegs) {
          const dx = f.x - p.x, dy = f.y - p.y, d = len(dx, dy) || 0.01, rr = f._baseR + p.r;
          if (d < rr) {
            const [nx, ny] = [dx / d, dy / d];
            f.x = p.x + nx * rr; f.y = p.y + ny * rr;
            const vn = f.vx * nx + f.vy * ny;
            if (vn < 0) { f.vx -= 1.85 * vn * nx; f.vy -= 1.85 * vn * ny; f.spin += rnd(-4, 4); }
            this._spark(f.x, f.y, this.theme.accent, 5);
          }
        }
      }
    } else if (this.hazard === "saw") {
      const s = this.haz.saw;
      s.phase += s.speed * dt; s.rot += 18 * dt;
      const sp = this._sawPos();
      for (const f of L) {
        const d = len(f.x - sp.x, f.y - sp.y);
        if (d < f._baseR + s.r) {
          f.hp -= 20 * dt; f.hitFlash = 1; f.scale = 1.15;
          const [nx, ny] = norm((f.x - sp.x) || 0.01, (f.y - sp.y) || 0.01);
          f.vx += nx * 1600 * dt; f.vy += ny * 1600 * dt; f.spin += rnd(-6, 6);
          this._spark(f.x, f.y, "#ffd27a", 6);
          this.shakes = Math.max(this.shakes, 6);
          if (f.hp <= 0) this._kill(f);
        }
      }
    } else if (this.hazard === "wind") {
      const w = this.haz.wind;
      w.a += w.turn * dt;
      const fx = Math.cos(w.a), fy = Math.sin(w.a);
      for (const f of L) { f.vx += fx * w.force * dt; f.vy += fy * w.force * dt; }
      for (const st of w.streaks) {
        st.x += fx * 260 * dt; st.y += fy * 260 * dt;
        if (st.x < -50) st.x = W + 50; else if (st.x > W + 50) st.x = -50;
        if (st.y < -50) st.y = H + 50; else if (st.y > H + 50) st.y = -50;
      }
    }
  }

  _explode(x, y, src) {
    this.flash = Math.max(this.flash, 0.95); this.shakes = Math.max(this.shakes, 26);
    this.hitstop = Math.max(this.hitstop, 0.06);
    this.rings.push({ x, y, rr: 24, spd: 1500, life: 0.5, c: "#ffb057" });
    this.rings.push({ x, y, rr: 12, spd: 900, life: 0.4, c: "#fff" });
    this._spark(x, y, "#ff7a2f", 44);
    this.callout = { txt: "💥 BOOM", t: 1.2 };
    sfx.ko(); this._logSfx("explode", {});
    const R = 360;
    for (const g of this.living()) {
      const d = len(g.x - x, g.y - y);
      if (d < R) {
        const f = 1 - d / R;
        const dmg = 30 * f;
        g.hp -= dmg; g.eDmg = Math.round(dmg); g.dmgPopT = 0.7; g.hitFlash = 1; g.scale = 1.2;
        const [nx, ny] = norm((g.x - x) || 0.01, (g.y - y) || 0.01);
        g.vx += nx * 1000 * f; g.vy += ny * 1000 * f; g.spin += rnd(-8, 8);
        if (g.hp <= 0) this._kill(g, src);
      }
    }
  }
}

// ---------------------------------------------------------------------
// Synthesized SFX (Web Audio, no assets) — ported spirit of battle_sim
// ---------------------------------------------------------------------
const sfx = (() => {
  let ac = null;
  function ctx() { if (!ac && !MUTED) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } return ac; }
  function blip(freq, dur, type, gain, sweep) {
    const a = ctx(); if (!a) return;
    const o = a.createOscillator(), g = a.createGain();
    o.type = type || "square"; o.frequency.setValueAtTime(freq, a.currentTime);
    if (sweep) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * sweep), a.currentTime + dur);
    g.gain.setValueAtTime(gain || 0.14, a.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, a.currentTime + dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur + 0.02);
  }
  return {
    hit(m1, m2, active) {
      if (m1 === "blunt" || m2 === "blunt") blip(150, 0.12, "sine", 0.16, 0.4);
      else if (m1 === "wood" || m2 === "wood") blip(320, 0.07, "triangle", 0.12, 0.6);
      else if (m1 === "whip" || m2 === "whip") blip(900, 0.05, "sawtooth", 0.10, 0.3);
      else if (m1 === "mechanical" || m2 === "mechanical") blip(90, 0.14, "sawtooth", 0.12);
      else blip(active ? 1400 : 800, 0.06, "square", active ? 0.16 : 0.10, 0.35);
    },
    parry() { blip(1800, 0.05, "square", 0.16, 0.5); setTimeout(() => blip(2400, 0.05, "square", 0.12, 0.6), 30); },
    ko() { blip(70, 0.35, "sawtooth", 0.22, 0.4); },
    pew() { blip(1200, 0.06, "sawtooth", 0.10, 0.35); },
    pickup() { blip(520, 0.10, "triangle", 0.14, 2.2); setTimeout(() => blip(880, 0.12, "triangle", 0.12, 1.8), 60); },
    count(n) { blip(n === 0 ? 700 : 420, n === 0 ? 0.25 : 0.1, "square", 0.16); },
    win() { [523, 659, 784, 1047].forEach((f, i) => setTimeout(() => blip(f, 0.18, "square", 0.15), i * 110)); },
  };
})();
